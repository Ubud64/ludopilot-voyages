<style>

*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.48 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;padding-bottom:calc(88px + env(safe-area-inset-bottom))}button,input,select,textarea{font:inherit}button{cursor:pointer}
.top{background:#102b44;color:white;padding:calc(11px + env(safe-area-inset-top)) 15px 12px}.top-line{max-width:720px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:8px}.brand{font-size:20px;font-weight:900}.subbrand{font-size:10px;opacity:.75;letter-spacing:1px;font-weight:800}.top-actions{display:flex;gap:6px;align-items:center}.headbtn{background:#ffffff1c;color:white;border:1px solid #ffffff44;border-radius:9px;padding:7px 9px;min-height:35px;font-size:13px}
main{max-width:720px;margin:auto;padding:16px 13px}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 4px 15px #16446009}h1{font-size:25px;line-height:1.2;letter-spacing:-.4px;margin:0 0 8px}h2{font-size:18px;margin:0 0 10px}h3{font-size:16px;margin:0 0 7px}p{margin:0 0 11px}.eyebrow{font-size:11px;color:var(--accent);font-weight:850;letter-spacing:1.2px;text-transform:uppercase}.subtitle,.muted{color:var(--muted)}.subtitle{font-size:13px}.smallprint{color:var(--muted);font-size:12px}
label{display:block;font-size:13px;font-weight:750;margin:12px 0 5px}.field{display:block;width:100%;border:1px solid #cbd9e2;border-radius:10px;background:white;color:var(--ink);min-height:45px;padding:11px;font-size:16px}.field:focus{outline:2px solid #85c9e4;outline-offset:1px}textarea.field{min-height:110px;resize:vertical}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.btn{background:var(--blue);border:0;border-radius:11px;color:white;font-weight:790;min-height:45px;padding:11px 13px;text-align:center;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}.btn.secondary{background:#e8f2f8;color:#0e668e}.btn.ghost{background:white;color:#244c65;border:1px solid #cbd9e2}.btn.teal{background:var(--accent)}.btn.danger{background:#fff0f0;color:#9c2929}.btn.small{font-size:13px;padding:8px 11px;min-height:36px}.btn:disabled{opacity:.5}.wide{width:100%}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:9px 0}.actions>.btn{flex:1;min-width:130px}.callout{padding:11px 13px;background:#edf8f7;border-left:3px solid var(--accent);border-radius:9px;color:#305e61;font-size:13px;margin:10px 0}.warning{background:#fff4e7;border-left-color:#b87618;color:#814b12}.error{background:#fff1f1;border-left-color:var(--red);color:#802b2b}.status{padding:11px;background:#eaf4f8;border-radius:10px;font-size:13px;margin:10px 0}.pill{display:inline-block;background:#e7f4f8;color:#206c87;border-radius:40px;font-size:12px;padding:4px 8px;font-weight:750}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.step{border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}.step.active{border:2px solid var(--accent);padding:11px;background:#f7fffd}.step-title{font-size:15px;font-weight:850}.meta{color:var(--muted);font-size:13px;margin:6px 0}.facts{padding-left:19px;margin:9px 0;font-size:13px}.facts li{margin-bottom:4px}.divider{height:1px;background:var(--line);margin:13px 0}
nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));background:white;border-top:1px solid var(--line);padding:7px 4px calc(6px + env(safe-area-inset-bottom));z-index:10;box-shadow:0 -4px 14px #16446009}nav button{background:transparent;border:0;color:#627588;font-size:10.5px;font-weight:800;display:grid;justify-items:center;gap:2px;padding:5px 2px;border-radius:10px}nav button.active{background:#eaf4fa;color:var(--blue)}nav button .icon{font-size:22px;line-height:1.25}
#toast{position:fixed;z-index:20;bottom:calc(92px + env(safe-area-inset-bottom));left:14px;right:14px;max-width:620px;margin:auto;background:#173b50;color:white;border-radius:11px;padding:11px 14px;text-align:center;display:none;box-shadow:0 6px 25px #0003}.suggestions{margin-top:3px;border:1px solid #cee0e8;background:#fff;border-radius:11px;overflow:hidden;box-shadow:0 5px 14px #16446017}.suggestions button{width:100%;text-align:left;background:#fff;color:var(--ink);border:0;border-bottom:1px solid var(--line);padding:11px 12px;line-height:1.35}.suggestions button:last-child{border-bottom:none}.suggestions .suggest-meta{font-size:11px;color:var(--muted)}.near-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.placebtn{min-height:82px;border:1px solid var(--line);border-radius:13px;padding:12px;background:white;color:var(--ink);text-align:center;font-weight:800;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px}.placebtn .emoji{font-size:26px}.placebtn:disabled{cursor:wait}.placebtn.selected{border:3px solid var(--accent);padding:10px;background:#e4f7f2;color:#06665f;box-shadow:0 0 0 2px #c4eee6 inset}.placebtn.selected::after{content:'✓ Sélectionné';font-size:12px;font-weight:900;color:#056b64}.driver-place{text-align:center;font-size:clamp(26px,8vw,43px);overflow-wrap:anywhere;font-weight:900;margin:20px 0}.driver-translation{text-align:center;font-size:22px;font-weight:800;margin:12px 0}.driver-caption{text-align:center;letter-spacing:1px;color:var(--accent);font-size:12px;font-weight:850}.driver-address{text-align:center;color:var(--muted);overflow-wrap:anywhere}.questionbtn{text-align:left;width:100%;margin:5px 0;justify-content:flex-start;line-height:1.35;white-space:normal}.questionbtn.selected{background:#e4f7f2;border:2px solid var(--accent);color:#06665f}.questionbtn:disabled{opacity:.55}.question-tip{margin-top:10px;color:var(--muted);font-size:12px}.archive-title{font-size:16px;font-weight:800}.help-number{font-size:26px;font-weight:900}.help-red{background:#b62e39;color:white}.help-red .subtitle{color:#ffedf0}.link{color:var(--blue);word-wrap:anywhere}.line-check{display:flex;align-items:flex-start;gap:9px;font-size:13px}.line-check input{margin-top:4px;accent-color:var(--accent)}
@media(max-width:365px){.grid2{grid-template-columns:1fr}.actions>.btn{min-width:110px}.top{padding-left:9px;padding-right:9px}.brand{font-size:18px}main{padding:13px 10px}}@media print{.top,nav,.actions,.btn{display:none!important}body{padding:0;background:white}.card{border:none}}
/* V1.15 : listes compactes classées par distance, sans publicité */
.near-row{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;margin:7px 0;padding:12px;border:1px solid var(--line);border-radius:11px;background:white;color:var(--ink)}
.near-row strong{display:block;font-size:14px}.near-row small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.near-distance{flex-shrink:0;color:#087870;font-weight:800;font-size:13px}
.help-select{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:10px 0}.help-select button{padding:10px 7px;min-height:49px;border:1px solid var(--line);background:white;border-radius:10px;color:var(--ink);font-size:13px;font-weight:800}.help-select button.active{background:#e4f7f2;border:2px solid var(--accent);padding:9px 6px;color:#06665f}
.help-emergency{background:#a8343c;color:#fff}.help-emergency h2,.help-emergency .subtitle{color:#fff}.help-emergency a{display:inline-flex;background:#fff;color:#a12c36;align-items:center;justify-content:center;text-decoration:none;padding:10px 12px;min-height:43px;border-radius:10px;font-weight:900;margin:4px 5px 4px 0}
.help-phrase{border-bottom:1px solid var(--line);padding:10px 0}.help-phrase strong{font-size:16px;display:block}.help-phrase small{color:var(--muted);font-size:12px}
details > summary{cursor:pointer;font-weight:800;padding:8px 0}
/* V1.15 : écran d'assistance sans choix intermédiaire. */
.safety-place{border:1px solid var(--line);border-radius:12px;padding:11px;margin:8px 0;background:#fff}
.safety-place .place-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:9px}
.safety-place .place-category{font-size:12px;color:var(--muted);font-weight:750}
.safety-place .place-address{font-size:12px;color:var(--muted);margin:4px 0 0}
.safety-place-name{display:inline;color:var(--ink);font-weight:850;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px;overflow-wrap:anywhere}
.safety-place .place-actions{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.safety-place .place-actions>*{flex:1;min-width:110px}
.safety-place .place-distance{color:#06665f;font-weight:850;white-space:nowrap}
.safety-alert{background:#fff2e5;border-left:4px solid #c26e0e;color:#70450d;border-radius:10px;padding:10px 12px;margin-bottom:13px}
.safety-alert .local-phrase{font-weight:900;font-size:16px;margin-top:5px;display:block}
.safety-quicklinks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:10px 0 14px}.safety-quicklinks .btn{min-width:0;text-align:center;line-height:1.3;min-height:46px;white-space:normal}

/* V1.15 · Messages de secours. Rien d'autre ne change. */
.emergency-choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:10px 0}
.emergency-choices button{border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font-size:12px;font-weight:800;min-height:50px;padding:7px 4px;line-height:1.3}
.emergency-choices button.active{background:#e4f7f2;color:#06665f;border:2px solid var(--accent);padding:6px 3px}
.emergency-show{background:#f3f9fb;border-radius:12px;padding:13px;margin:10px 0}
.emergency-show strong{display:block;font-size:clamp(18px,5vw,24px);line-height:1.4;overflow-wrap:anywhere;color:#12394b}
.emergency-show .emergency-french{font-size:13px;margin-top:9px;color:var(--muted)}
.emergency-custom{margin-top:12px}.emergency-custom textarea{min-height:72px}
.emergency-custom label{margin-top:8px}.emergency-custom .smallprint{margin:7px 0}
.emergency-personalization{margin:12px 0 0;padding-top:8px;border-top:1px solid var(--line)}
.emergency-personalization summary{font-size:13px;color:var(--muted)}
.emergency-personalization label{display:flex;gap:8px;align-items:center;font-weight:650}
@media(max-width:365px){.emergency-choices button{font-size:11px}}

/* V1.18 : messages de voyage ciblés, sans surcharge. */
.help-simplified .emergency-top-call{display:block;text-align:center;color:#fff;background:#b62e39;border-radius:13px;padding:13px 12px;font-size:17px;font-weight:900;text-decoration:none;min-height:50px;margin:0 0 14px}
.help-simplified .emergency-top-call:focus-visible,.help-simplified button:focus-visible{outline:3px solid #087e77;outline-offset:3px}
.help-simplified .emergency-unavailable{font-size:13px;color:#934034;background:#fff2e5;padding:9px 11px;border-radius:9px;margin:0 0 12px}
.help-simplified .emergency-choice-label{font-size:14px;font-weight:850;margin-bottom:7px}
.help-simplified .emergency-choices{margin:0 0 13px;gap:8px}
.help-simplified .emergency-choices button{font-size:13px;min-height:54px;border-radius:12px}
.help-simplified .emergency-show{background:#f1f8fa;margin:10px 0 0;padding:15px;border-radius:14px}
.help-simplified .emergency-show strong{font-size:clamp(21px,5.6vw,27px);line-height:1.32}
.help-simplified .emergency-show .emergency-french{font-size:13px;line-height:1.4;margin-top:9px}
.help-simplified .emergency-custom{margin:0 0 12px}
.help-simplified .emergency-custom textarea{min-height:74px}
.help-simplified .emergency-custom label{font-size:13px;margin:0 0 5px}
.help-simplified .emergency-custom .btn{margin-top:8px}
.help-simplified .emergency-custom details{margin-top:9px;border:0}
.help-simplified .emergency-custom details summary{font-weight:650;font-size:12px;color:var(--muted)}
.help-simplified .emergency-custom details textarea{margin-top:6px}
.help-simplified .emergency-personalization{margin-top:11px;padding-top:5px}
.help-simplified .emergency-profile-alert{font-size:12px;color:#97322c;padding:8px 10px;border-radius:9px;background:#fff4eb;margin-top:9px}
.help-simplified .emergency-micro{font-size:11px;color:var(--muted);margin:6px 0 0}
.help-simplified .emergency-status{margin:8px 0 0;font-size:12px}
@media(max-width:365px){.help-simplified .emergency-choices button{font-size:12px;padding:6px 2px}}

/* Situations préparées : les quatre principales sont visibles sans défilement. */
.emergency-risk-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin:6px 0 9px}
.emergency-risk-grid button{min-height:47px;padding:8px 7px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font-weight:720;text-align:center;line-height:1.24;font-size:13px}
.emergency-risk-grid button.active{border:2px solid var(--accent);padding:7px 6px;color:#06665f;background:#e4f7f2}
.emergency-risk-more{background:none;border:0;color:#176a89;padding:6px 0;font-weight:750;font-size:13px;margin:0 0 6px}
.emergency-risk-grid button:focus-visible,.emergency-risk-more:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* V1.19 · Mon sac. Même comportement que l'ancienne vue Swift, mémoire séparée. */
nav button{font-size:10px;min-width:0}nav button .icon{font-size:20px}
.bag-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bag-stat{background:#f0f8fa;border-radius:13px;padding:12px}
.bag-stat strong{display:block;font-size:21px;font-weight:900;color:var(--ink)}
.bag-stat small{font-size:12px;color:var(--muted)}
.bag-over{color:#af2f32!important}
.bag-line{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.bag-line:last-child{border-bottom:0}
.bag-line label{margin:0;flex:1;display:flex;align-items:center;gap:10px;min-width:0;font-weight:normal}
.bag-line label input{width:23px;height:23px;flex-shrink:0;accent-color:var(--accent)}
.bag-item-info{min-width:0}.bag-item-info strong{display:block;font-size:14px;overflow-wrap:anywhere}
.bag-item-info small{display:block;color:var(--muted);font-size:12px}
.bag-line .bag-edit{border:1px solid var(--line);border-radius:9px;background:#fff;color:#25546c;padding:6px 9px;min-height:38px}
.bag-dim{opacity:.6}.bag-editor{background:#f7fbfc;border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:12px}
.bag-container{border:1px solid var(--line);border-radius:12px;padding:11px;margin:8px 0}
.bag-container label{margin:0}.bag-container input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
.bag-progress{height:8px;background:#e5edf1;border-radius:20px;overflow:hidden;margin:8px 0}.bag-progress>span{display:block;height:100%;background:var(--accent)}
@media(max-width:365px){nav button{font-size:9px;padding:5px 0}nav button .icon{font-size:19px}}
</style>

<script>

// Currencies les plus courantes pour nos voyages ; le reste demeure affiche sans taux invente.
const FX_CODES=['PHP','THB','IDR','MUR','USD','GBP','JPY','KRW','VND','MYR','SGD','AUD','CAD','CHF','CNY','HKD','TWD','NZD','INR','KHR','LAK','MMK','EUR'];
const AMOUNT_RE='(?:\\d{1,3}(?:[\\s\\u00a0\\u202f.,]\\d{3})+(?:[.,]\\d{1,2})?|\\d+(?:[.,]\\d{1,2})?)';
const MONEY_RE=new RegExp('(?<![A-Za-z0-9])((?:'+FX_CODES.join('|')+'|PhP|US\\$|₱|฿|₫|Rp\\.?|₩|₹|£|¥|\\$|Rs\\.?)\\s*)('+AMOUNT_RE+')|(?<![A-Za-z0-9])('+AMOUNT_RE+')\\s*('+FX_CODES.join('|')+'|pesos?|baht|rupiahs?|roupies?|ringgits?|dollars?)(?![A-Za-z])','gi');
const euroFormatter=new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',minimumFractionDigits:2,maximumFractionDigits:2});
function currencyCode(token){const s=String(token||'').trim().replace(/\.$/,'').toLowerCase();
 if(s==='₱'||s==='php'||s==='peso'||s==='pesos'||s==='php')return'PHP';
 if(s==='฿'||s==='thb'||s==='baht')return'THB';
 if(s==='rp'||s==='idr'||s==='rupiah'||s==='rupiahs')return'IDR';
 if(s==='rs'||s==='mur'||s==='roupie'||s==='roupies')return state.country==='MU'||s==='mur'?'MUR':null;
 if(s==='₫'||s==='vnd')return'VND';if(s==='₩'||s==='krw')return'KRW';if(s==='₹'||s==='inr')return'INR';
 if(s==='£'||s==='gbp')return'GBP';if(s==='¥')return'JPY';if(s==='us$'||s==='$'||s==='dollar'||s==='dollars')return'USD';
 if(s==='ringgit'||s==='ringgits')return'MYR';return FX_CODES.includes(s.toUpperCase())?s.toUpperCase():null;
}
function parseLocalAmount(raw){let s=String(raw||'').replace(/[\u00a0\u202f\s]/g,'');const comma=s.lastIndexOf(','),dot=s.lastIndexOf('.');if(comma>=0&&dot>=0){const dec=comma>dot?',':'.';s=s.replace(dec===','?/\./g:/,/g,'').replace(dec,'.');}
 else if(comma>=0||dot>=0){const sep=comma>=0?',':'.';const parts=s.split(sep);if(parts.length>2||parts.length===2&&parts[1].length===3&&parts[0].length<=3){s=parts.join('');}else if(sep===',')s=s.replace(',','.');}
 const val=Number(s);return Number.isFinite(val)&&val>=0?val:null;}
function hasFreshFx(){return !!(fx.rates&&fx.date&&Number.isFinite(Date.parse(fx.date+'T00:00:00Z'))&&Date.now()-Date.parse(fx.date+'T00:00:00Z')<32*86400000);}
function annotatePrices(raw){return String(raw??'').replace(MONEY_RE,(whole,prefix,frontNum,backNum,suffix,offset,original)=>{
 const token=prefix||suffix,code=currencyCode(token);if(!code||code==='EUR')return whole;
 const val=parseLocalAmount(frontNum||backNum);if(val===null)return whole;
 if(/^\s*\(\s*(?:≈|~)?\s*\d[\d\s.,]*\s*€/.test(original.slice(offset+whole.length)))return whole;
 const rate=fx.rates&&Number(fx.rates[code.toLowerCase()]);
 if(hasFreshFx()&&Number.isFinite(rate)&&rate>0)return whole+' (≈ '+euroFormatter.format(val/rate)+')';
 return whole;
 });}
function moneyHtml(value){const s=String(value??'');return '<span class="money-display" data-money="'+esc(s)+'">'+esc(annotatePrices(s))+'</span>';}
function updateMoneyNodes(){document.querySelectorAll('[data-money]').forEach(el=>{el.textContent=annotatePrices(el.dataset.money);});const note=byId('fxInfo');if(note)note.remove();}
async function ensureFxRates(){if(fx.busy||fx.attemptedAt&&Date.now()-fx.attemptedAt<60000)return;if(hasFreshFx()&&Date.now()-fx.fetchedAt<12*3600000)return;if(!navigator.onLine){fx.error=!hasFreshFx();updateMoneyNodes();return;}

 const urls=['https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/eur.min.json','https://latest.currency-api.pages.dev/v1/currencies/eur.min.json'];
 try{let result=null;for(const url of urls){const ac=new AbortController(),timer=setTimeout(()=>ac.abort(),8500);try{const r=await fetch(url,{signal:ac.signal,cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const j=await r.json();if(!j?.eur||!/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(j.date||'')||!Number.isFinite(Number(j.eur.php))||!Number.isFinite(Number(j.eur.thb)))throw Error('Taux non valides');result=j;break;}catch(_){ }finally{clearTimeout(timer);}}
 if(!result)throw Error('Taux de change inaccessibles');fx.rates=result.eur;fx.date=result.date;fx.fetchedAt=Date.now();try{localStorage.setItem(FX_STORAGE,JSON.stringify({rates:fx.rates,date:fx.date,fetchedAt:fx.fetchedAt}));}catch(_){ }
 }catch(_){fx.error=!hasFreshFx();}finally{fx.busy=false;updateMoneyNodes();}}

function bagWeight(item){return item.packed?Math.max(0,Number(item.grams)||0)*Math.max(1,Number(item.qty)||1):0;}
function bagSectionWeight(id){return bag.items.filter(x=>x.container===id).reduce((sum,x)=>sum+bagWeight(x),0);}
function bagContainer(id){return bag.containers.find(x=>x.id===id);}
function bagTotal(){return bagSectionWeight('onBody')+bag.containers.filter(c=>c.carried).reduce((sum,c)=>sum+Math.max(0,Number(c.emptyGrams)||0)+bagSectionWeight(c.id),0);}
function bagWeightText(g){return g>=1000?(g/1000).toLocaleString('fr-FR',{maximumFractionDigits:2})+' kg':Math.round(g)+' g';}

function buildSac(){const carried=bag.items.filter(x=>x.packed&&(x.container==='onBody'||bagContainer(x.container)?.carried));const back=bagContainer('backpack');const backWeight=back?bagSectionWeight('backpack')+Number(back.emptyGrams||0):0;
 return header('Préparer et vérifier','🎒 Mon sac','Mon inventaire personnel, enregistré sur cet appareil.')+
 `<section class="card"><div class="bag-stats"><div class="bag-stat"><small>Poids transporté</small><strong>${bagWeightText(bagTotal())}</strong></div><div class="bag-stat"><small>Affaires cochées</small><strong>${carried.length} / ${bag.items.length}</strong></div></div>
 ${back?`<div style="margin-top:13px"><div class="row"><strong>Sac à dos</strong><strong class="${back.limitGrams>0&&backWeight>back.limitGrams?'bag-over':''}">${bagWeightText(backWeight)} / ${bagWeightText(back.limitGrams||7000)}</strong></div><div class="bag-progress"><span style="width:${Math.max(0,Math.min(100,100*backWeight/Math.max(1,Number(back.limitGrams)||7000)))}%;${back.limitGrams>0&&backWeight>back.limitGrams?'background:#a93439':''}"></span></div>${back.limitGrams>0&&backWeight>back.limitGrams?'<p class="callout warning">Attention : sac à dos au-dessus de la limite.</p>':''}</div>`:''}
 <p class="smallprint" style="margin-top:9px">60 affaires reprises de tes captures de l’ancien LudoPilot. Les deux premières cases (passeport et CB principale) restent à vérifier, car elles sont coupées sur la photo.</p></section>`+
 `<section class="card"><div class="row"><h2 style="margin:0">Mes contenants</h2><button class="btn small secondary" data-bag-new-container="1">＋ Ajouter</button></div>${bag.containers.map(c=>{const total=bagSectionWeight(c.id)+(c.carried?Number(c.emptyGrams)||0:0);return `<div class="bag-container"><div class="row"><strong>${esc(c.name)}</strong><button class="btn small ghost" data-bag-edit-container="${esc(c.id)}">✏️ Modifier</button></div><div class="row"><label class="line-check"><input type="checkbox" data-bag-carried="${esc(c.id)}" ${c.carried?'checked':''}> Emporté</label><strong class="${c.carried&&c.limitGrams&&total>c.limitGrams?'bag-over':''}">${bagWeightText(total)}${c.limitGrams?' / '+bagWeightText(c.limitGrams):''}</strong></div></div>`}).join('')}</section>`+
 `<div id="bagEditorAnchor">${bagEditorHtml()}</div>`+
 bagItemSection('onBody','👤 Sur moi')+bag.containers.map(c=>bagItemSection(c.id,'🎒 '+c.name)).join('')+
 `<section class="card"><h2>💾 Sauvegarder mon sac</h2><div class="actions"><button id="exportBag" class="btn secondary">Exporter</button><button id="importBagButton" class="btn ghost">Importer</button></div><input id="bagImport" type="file" accept=".json,application/json" hidden><p class="smallprint">Cette liste reste sur cet appareil. Conserve une copie JSON dans Fichiers ou iCloud.</p></section>`;
}

function bagSaveItem(){const name=byId('bagItemName')?.value.trim().slice(0,120);if(!name){toast('Donne un nom à l’affaire.');return;}
 const x=bag.items.find(y=>y.id===bagEditor?.id);const grams=Math.max(0,Math.min(1000000,Math.round(Number(byId('bagItemWeight')?.value)||0)));const qty=Math.max(1,Math.min(100,Math.round(Number(byId('bagItemQty')?.value)||1)));
 const value={id:x?.id||uid(),name,grams,qty,container:byId('bagItemDestination')?.value||'onBody',packed:x?.packed??false,critical:!!byId('bagItemCritical')?.checked,forgottenBefore:x?.forgottenBefore||false};
 if(x)Object.assign(x,value);else bag.items.push(value);saveBag();bagEditorClose();toast('Affaire enregistrée.');}

function downloadBag(){const blob=new Blob([JSON.stringify({app:'LudoPilot Voyages',kind:'mon-sac',version:1,exported:new Date().toISOString(),items:bag.items,containers:bag.containers},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='LudoPilot-Mon-sac.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);toast('Sac exporté.');}
async function importBag(file){if(!file)return;try{if(file.size>3000000)throw Error('Fichier trop volumineux');const data=JSON.parse(await file.text());if(!Array.isArray(data.items)||!Array.isArray(data.containers)||data.items.length>1000||data.containers.length>30)throw Error('Format de sac non reconnu');
 const containers=data.containers.filter(c=>c&&typeof c.name==='string'&&typeof c.id==='string').map(c=>({id:c.id.slice(0,100),name:c.name.slice(0,90),emptyGrams:Math.max(0,Number(c.emptyGrams)||0),limitGrams:Math.max(0,Number(c.limitGrams)||0),carried:c.carried!==false}));
 const keys=new Set(containers.map(c=>c.id));const items=data.items.filter(x=>x&&typeof x.name==='string').map(x=>({id:typeof x.id==='string'?x.id:uid(),name:x.name.slice(0,120),grams:Math.max(0,Number(x.grams)||0),qty:Math.max(1,Number(x.qty)||1),container:keys.has(x.container)?x.container:'onBody',packed:x.packed===true,critical:x.critical===true,forgottenBefore:x.forgottenBefore===true}));
 if(!confirm(`Importer ${items.length} affaires en remplaçant le sac actuel ? Exporte d’abord le sac actuel si tu veux le conserver.`))return;bag={version:1,containers,items,source:'import'};saveBag();bagEditor=null;render();toast('Sac importé.');}catch(e){toast('Import impossible : '+String(e.message||e));}}

function nearLocation(){const g=state.gps;if(!g||!validPoint(g.lat,g.lon)||!Number.isFinite(g.accuracy)||g.accuracy>1500||Date.now()-(g.when||0)>5*60*1000)return null;const label=g.lat.toFixed(5)+', '+g.lon.toFixed(5);return {lat:g.lat,lon:g.lon,label,text:label,gps:true};}
async function reverseGpsPosition(lat,lon){const ac=new AbortController(),timer=setTimeout(()=>ac.abort(),8500);try{const url='https://nominatim.openstreetmap.org/reverse?format=jsonv2&addressdetails=1&zoom=14&accept-language=fr&lat='+encodeURIComponent(lat)+'&lon='+encodeURIComponent(lon);const response=await fetch(url,{headers:{Accept:'application/json'},signal:ac.signal});if(!response.ok)throw Error('Géocodage indisponible');const data=await response.json();const a=data?.address||{};const area=a.suburb||a.neighbourhood||a.city_district||a.borough||'';const city=a.city||a.town||a.municipality||a.village||a.county||'';const country=a.country||'';const parts=[area,city,country].filter(Boolean).filter((v,i,all)=>all.findIndex(w=>w.toLowerCase()===v.toLowerCase())===i);if(!city||!country)throw Error('Ville non déterminée');return parts.join(', ');}finally{clearTimeout(timer);}}

async function detectCountry(lat,lon){
 try{
  const u='https://nominatim.openstreetmap.org/reverse?format=jsonv2&addressdetails=1&zoom=10&accept-language=fr&lat='+encodeURIComponent(lat)+'&lon='+encodeURIComponent(lon);
  const ac=new AbortController(),timer=setTimeout(()=>ac.abort(),8500);
  let data;try{const r=await fetch(u,{headers:{Accept:'application/json'},signal:ac.signal});if(!r.ok)throw Error('Pays non disponible');data=await r.json();}finally{clearTimeout(timer);}
  const a=data?.address||{},code=String(a.country_code||'').toUpperCase();
  if(!code)return;
  state.country=COUNTRY[code]?code:'OTHER';save();
  // La rubrique Proche ne doit pas valider ou modifier le corridor d'urgence.
  if(state.tab==='aide')render();
 }catch(_){if(state.tab==='aide')render();}
}

function distanceMeters(lat1,lon1,lat2,lon2){
 const rad=n=>n*Math.PI/180,dlat=rad(lat2-lat1),dlon=rad(lon2-lon1);
 const h=Math.sin(dlat/2)**2+Math.cos(rad(lat1))*Math.cos(rad(lat2))*Math.sin(dlon/2)**2;
 return 12742000*Math.asin(Math.min(1,Math.sqrt(h)));
}
function distanceLabel(d){return d<1000?Math.max(10,Math.round(d/10)*10)+' m':(d/1000).toFixed(1).replace('.',',')+' km';}
function queriesForKeys(keys,lat,lon,radius){
 const center='(around:'+radius+','+lat.toFixed(6)+','+lon.toFixed(6)+')';
 // Une requête courte par grand type de service, pour limiter les erreurs 429/504.
 const safety=keys.every(k=>['hospital','clinic','doctor','pharmacy','police'].includes(k));
 if(safety){
  const groups=[];
  if(keys.some(k=>['hospital','clinic','doctor','pharmacy','police'].includes(k))){
   const wanted={hospital:'hospital',clinic:'clinic|health_post',doctor:'doctors',pharmacy:'pharmacy',police:'police'};
   const values=keys.map(k=>wanted[k]).filter(Boolean).join('|');
   groups.push('nwr["amenity"~"^('+values+')$"]'+center+';');
  }
  const hc=keys.filter(k=>k!=='police').map(k=>({hospital:'hospital',clinic:'clinic|centre|health_post',doctor:'doctor|doctors',pharmacy:'pharmacy'})[k]).filter(Boolean).join('|');
  if(hc)groups.push('nwr["healthcare"~"^('+hc+')$"]'+center+';');
  if(keys.includes('pharmacy'))groups.push('nwr["shop"~"^(chemist|drugstore)$"]'+center+';');
  if(keys.includes('police'))groups.push('nwr["office"="police"]'+center+';');
  if(keys.includes('police'))groups.push('nwr["police"~"^(station|precinct)$"]'+center+';');
  return '[out:json][timeout:18];('+groups.join('')+');out center 900;';
 }
 return '[out:json][timeout:16];('+keys.flatMap(k=>(PLACE_TAGS[k]||[]).map(t=>'nwr'+t+center+';')).join('')+');out center 400;';
}
function osmPlaces(elements,lat,lon,radius){
 const seen=new Set();return elements.map(el=>{
  const a=Number(el.lat??el.center?.lat),b=Number(el.lon??el.center?.lon);
  const name=String(el.tags?.['name:fr']||el.tags?.name||el.tags?.['name:en']||el.tags?.brand||'').trim();
  if(!name||!validPoint(a,b))return null;
  const distance=distanceMeters(lat,lon,a,b);
  if(distance>radius+200)return null;
  return {name,lat:a,lon:b,distance};
 }).filter(Boolean).sort((a,b)=>a.distance-b.distance).filter(x=>{
  const k=x.name.toLocaleLowerCase()+'|'+x.lat.toFixed(4)+'|'+x.lon.toFixed(4);
  if(seen.has(k))return false;seen.add(k);return true;
 });
}
async function findOsmPlaces(keys,lat,lon,radius=3000){
 const q=queriesForKeys(keys,lat,lon,radius);
 for(const base of PLACE_SEARCH_SERVERS){
  const ac=new AbortController(),timer=setTimeout(()=>ac.abort(),11000);
  try{const r=await fetch(base+encodeURIComponent(q),{signal:ac.signal});if(!r.ok)throw Error('Service cartographique indisponible');
   const j=await r.json();if(!Array.isArray(j.elements))throw Error('Réponse invalide');return osmPlaces(j.elements,lat,lon,radius);
  }catch(_){/* Essayer un autre serveur, sans masquer l'échec final. */}finally{clearTimeout(timer);}
 }
 throw Error('Recherche locale indisponible');
}
function routeToPlace(place,mode='walking',kind='near'){
 const loc=kind==='safety'?safety.position:state.gps;
 if(!loc||!place||!validPoint(place.lat,place.lon)||!Number.isFinite(place.distance))return null;
 const maxAge=kind==='safety'?15*60000:5*60000;
 const maxKm=kind==='safety'?6000:12000;
 if(kind==='safety'&&!safety.verified)return null;
 if(Date.now()-(loc.when||0)>maxAge)return null;
 if(distanceMeters(loc.lat,loc.lon,place.lat,place.lon)>maxKm)return null;
 // A route may ONLY use current verified GPS + the concrete GPS coordinates of a nearby place.
 return 'https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(loc.lat.toFixed(6)+','+loc.lon.toFixed(6))+

}

async function translateEmergencyMessage(){

  emergencyMessage.customLocal=fr;emergencyMessage.customLang='fr';emergencyMessage.translatedFor=fr;

 }
 if(!navigator.onLine){emergencyMessage.error='Hors connexion : utilise une phrase prête ou une traduction déjà enregistrée.';render();return;}
 emergencyMessage.busy=true;emergencyMessage.error='';render();
 const ac=new AbortController(),timer=setTimeout(()=>ac.abort(),11000);
 try{
  // Service tiers gratuit facultatif. Ne jamais l'interroger automatiquement.
  const url='https://api.mymemory.translated.net/get?'+new URLSearchParams({q:fr,langpair:'fr|'+lang.lang}).toString();
  const r=await fetch(url,{signal:ac.signal,cache:'no-store'});
  if(!r.ok)throw Error('indisponible');
  const json=await r.json();
  if(Number(json.responseStatus)!==200||typeof json.responseData?.translatedText!=='string')throw Error('traduction indisponible');
  const translated=new DOMParser().parseFromString(json.responseData.translatedText,'text/html').documentElement.textContent.trim();
  if(!translated||/^(QUERY LENGTH LIMIT|MYMEMORY WARNING|PLEASE USE)/i.test(translated))throw Error('traduction indisponible');
  // Le message peut avoir changé pendant la requête (nouvelle saisie ou langue GPS).
  if(fr!==emergencyMessage.customFr.trim()||lang.lang!==emergencyLanguage().lang)return;
  emergencyMessage.customLocal=translated.slice(0,1000);emergencyMessage.customLang=lang.lang;
  emergencyMessage.translatedFor=fr;emergencyMessage.error='Relis cette traduction automatique avant de t’en servir.';
  saveEmergencyMessage();

 }finally{clearTimeout(timer);emergencyMessage.busy=false;render();}

   if(r.status===429||r.status===406)continue;
   if(!r.ok)throw Error('Serveur cartographique indisponible');
   const j=await r.json();if(!Array.isArray(j.elements))throw Error('Réponse invalide');
   return j.elements;
  }catch(_){/* serveur suivant */}finally{clearTimeout(timer);}
 }
 throw Error('Cartographie indisponible');

function safetyResultsFromOsm(elements,lat,lon,radius){
 const out=Object.fromEntries(SAFETY_TABS.map(x=>[x[0],[]]));
 for(const el of elements){
  const tags=el.tags||{},a=Number(el.lat??el.center?.lat),b=Number(el.lon??el.center?.lon);
  const name=String(tags['name:fr']||tags.name||tags['name:en']||tags.brand||'').trim();
  if(!name||!validPoint(a,b))continue;
  const distance=distanceMeters(lat,lon,a,b);if(distance>radius+100||distance>6000)continue;
  const values=[tags.healthcare,tags.amenity,tags.shop,tags.office,tags.government,tags.police]
   .map(x=>String(x||'').toLowerCase());
  const lowName=name.toLowerCase();
  let category='';
  if(values.includes('hospital'))category='hospital';
  else if(values.includes('clinic')||values.includes('health_post')||values.includes('centre'))category='clinic';
  else if(values.includes('doctor')||values.includes('doctors'))category='doctor';
  else if(values.includes('pharmacy')||values.includes('chemist')||values.includes('drugstore')||
   /\b(watsons|mercury drug|southstar drug|the generics pharmacy|rose pharmacy)\b/i.test(name))category='pharmacy';
  else if(values.includes('police')||values.includes('station')||values.includes('precinct')||
   /\b(police station|police precinct|police community|polisi|gendarmerie|polizei|comisaria)\b/i.test(name))category='police';
  if(!category)continue;
  if(category==='police'&&/museum|academy|school|training|hotel|residence|historical/i.test(name))continue;
  const ph=phoneFromTags(tags);
  const addr=[tags['addr:housenumber'],tags['addr:street'],tags['addr:city']].filter(Boolean).join(' ');
  out[category].push({name,category,lat:a,lon:b,distance,
   phone:ph,note:addr,osmType:el.type,osmId:Number(el.id)||0,
   emergency:tags.emergency==='yes'||tags['emergency:ward']==='yes'});
 }
 for(const [key,values] of Object.entries(out)){
  const seen=new Set();out[key]=values.sort((a,b)=>a.distance-b.distance).filter(p=>{
   const id=p.name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,'')+'|'+p.lat.toFixed(4)+'|'+p.lon.toFixed(4);
   if(seen.has(id))return false;seen.add(id);return true;
  }).slice(0,65);
 }
 return out;
}
async function findPhotonSafety(lat,lon,onBatch){
 // Index Photon, accès gratuit sans clé. Source complémentaire indépendante d'Overpass,
 // mais issue d'OpenStreetMap : elle peut elle aussi être incomplète.
 const out=Object.fromEntries(SAFETY_TABS.map(x=>[x[0],[]]));
 for(const [q,expected] of [['clinic','clinic'],['police station','police'],['pharmacy','pharmacy'],['hospital','hospital']]){
  const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),5500);
  try{
   const u='https://photon.komoot.io/api/?'+new URLSearchParams({q,lat:String(lat),lon:String(lon),limit:'40',lang:'en'});
   const res=await fetch(u,{signal:ctrl.signal});if(!res.ok)continue;
   const j=await res.json();
   for(const f of j.features||[]){
    const p=f.properties||{},coords=f.geometry?.coordinates;
    if(!Array.isArray(coords)||!validPoint(coords[1],coords[0]))continue;
    const d=distanceMeters(lat,lon,coords[1],coords[0]);if(d>3500)continue;
    const osm=String(p.osm_value||'').toLowerCase(),name=String(p.name||'').trim();if(!name)continue;
    let cat='';
    if(osm==='hospital')cat='hospital';
    else if(['clinic','health_post','centre'].includes(osm))cat='clinic';
    else if(['doctors','doctor'].includes(osm))cat='doctor';
    else if(['pharmacy','chemist','drugstore'].includes(osm))cat='pharmacy';
    else if(osm==='police'||osm==='station'&&/police|precinct/i.test(name))cat='police';
    if(!cat||cat!==expected)continue;
    out[cat].push({name,category:cat,lat:coords[1],lon:coords[0],distance:d,phone:phoneFromTags(p.extra||p),osmType:p.osm_type,osmId:Number(p.osm_id)||0,note:[p.street,p.city].filter(Boolean).join(', ')});
   }
   if(typeof onBatch==='function')onBatch(out);
  }catch(_){/* Photon peut être indisponible */}finally{clearTimeout(timer);}
 }
 return out;
}

// Complément automatique pour les fiches Photon. Le numéro est attaché à l'identifiant
// OSM EXACT du lieu, jamais déduit d'un nom d'enseigne ou d'une ville.
async function enrichPhotonPhones(found,onBatch){
 const pending=[];
 for(const [category] of SAFETY_TABS)for(const p of found[category]||[]){
  const t=({N:'node',W:'way',R:'relation',node:'node',way:'way',relation:'relation'})[p.osmType];
  if(!publicPhone(p.phone)&&t&&Number.isSafeInteger(p.osmId)&&p.osmId>0)
   pending.push({p,type:t,id:p.osmId});
 }
 // Ne jamais multiplier les appels pour une même adresse.
 const chosen=new Map();
 for(const p of pending.sort((a,b)=>a.p.distance-b.p.distance)){
  const key=p.type+':'+p.id;
  if(!chosen.has(key)&&chosen.size<45)chosen.set(key,p);
 }
 if(!chosen.size)return;
 const groups={node:[],way:[],relation:[]};
 for(const v of chosen.values())groups[v.type].push(v);
 let updated=false;
 await Promise.all(Object.entries(groups).filter(([,a])=>a.length).map(async ([type,group])=>{
  const plural={node:'nodes',way:'ways',relation:'relations'}[type];
  const ids=group.map(p=>p.id).join(',');
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),5500);
  try{
   const url='https://api.openstreetmap.org/api/0.6/'+plural+'?'+plural+'='+ids;
   const r=await fetch(url,{signal:controller.signal,headers:{Accept:'application/json'}});
   if(!r.ok) return;
   const j=await r.json();if(!Array.isArray(j.elements))return;
   for(const e of j.elements){
    const p=chosen.get(type+':'+e.id)?.p;
    if(!p||!e.tags)continue;
    const num=phoneFromTags(e.tags);
    if(num&&!publicPhone(p.phone)){p.phone=num;updated=true;}
   }
  }catch(_){/* Impossible de publier un numéro que la source ne fournit pas. */}
  finally{clearTimeout(timer);}
 }));
 if(updated&&typeof onBatch==='function')onBatch(found);
}
async function findSafetyCategories(lat,lon,onBatch){
 const categories=SAFETY_TABS.map(x=>x[0]);
 // Une première requête groupée proche, puis extension uniquement si possible.
 const found=Object.fromEntries(categories.map(c=>[c,[]]));
 let successful=false;
 try{
  const elements=await fetchSafetyElements(categories,lat,lon,2200);
  const nearby=safetyResultsFromOsm(elements,lat,lon,2200);
  for(const c of categories)found[c]=nearby[c]||[];
  successful=true;if(typeof onBatch==='function')onBatch(found);
 }catch(_){/* Essayer un moteur alternatif */}
 if(!successful||categories.filter(c=>found[c].length===0).length>=3){
  const more=await findPhotonSafety(lat,lon,batch=>{
   for(const c of categories)if(batch[c]?.length)found[c]=[...found[c],...batch[c]];
   if(typeof onBatch==='function')onBatch(found);
  });
  for(const c of categories)found[c]=[...found[c],...(more[c]||[])];
  if(Object.values(found).some(x=>x.length))successful=true;
 }
 if(successful&&categories.filter(c=>found[c].length===0).length>=2){
  // Deuxième recherche de rayon étendu, mais on garde toujours les premiers résultats.
  const missing=categories.filter(c=>found[c].length===0);
  try{
   const more=safetyResultsFromOsm(await fetchSafetyElements(missing,lat,lon,5000),lat,lon,5000);
   for(const c of missing)found[c].push(...(more[c]||[]));
   if(typeof onBatch==='function')onBatch(found);
  }catch(_){/* Conserver la liste en cours */}
 }
 if(!successful)throw Error('Services cartographiques temporairement indisponibles');
 await enrichPhotonPhones(found,onBatch);
 return found;
}

function addSegment(){const t=active();if(!t)return;const from=byId('segFrom')?.value.trim(),to=byId('segTo')?.value.trim();if(!from||!to){toast('Indique les deux lieux de l’étape.');return;}if(from.toLowerCase()===to.toLowerCase()){toast('Départ et arrivée identiques.');return;}if(t.segments.length>=16){toast('Maximum 16 segments.');return;}const prev=t.segments.at(-1);if(prev&&prev.to.trim().toLowerCase()!==from.toLowerCase()&&!confirm('Correspondance non raccordée avec l’étape précédente. Continuer ?'))return;t.segments.push(normalizeSegment({from,to,mode:byId('segMode').value,service:byId('segService').value.trim(),notes:byId('segNotes').value.trim()},t.segments.length));save();render();toast('Étape enregistrée.');}
function advance(delta){const t=active();if(!t||!t.segments?.length)return;const idx=t.currentIndex||0;if(delta>0&&idx>=t.segments.length-1){t.complete=true;save();toast('Dernière étape terminée.');return;}t.currentIndex=Math.max(0,Math.min(t.segments.length-1,idx+delta));t.complete=false;save();render();}
function mapUrl(s){const marine=['plane','ferry','boat'].includes(s.mode);const dest=validPoint(s.toLatitude,s.toLongitude)?`${s.toLatitude},${s.toLongitude}`:[s.to,address(s)].filter(Boolean).join(', ');if(marine)return'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(dest);let travelmode='driving';if(s.mode==='walk')travelmode='walking';if(s.mode==='bicycle')travelmode='bicycling';if(['train','metro','tram','bus','coach','jeepney','minibus','van'].includes(s.mode))travelmode='transit';const from=state.gps?`${state.gps.lat},${state.gps.lon}`:validPoint(s.fromLatitude,s.fromLongitude)?`${s.fromLatitude},${s.fromLongitude}`:s.from;return 'https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(from)+'&destination='+encodeURIComponent(dest)+'&travelmode='+travelmode;}
function openURL(url){window.open(url,'_blank','noopener,noreferrer');}
function nearUrl(){const place=nearLocation(),item=NEAR.find(n=>n[0]===state.selectedNear);if(!place||!item)return null;const lat=place.lat.toFixed(6),lon=place.lon.toFixed(6);return 'https://www.google.com/maps/search/'+encodeURIComponent(item[3])+'/@'+lat+','+lon+',15z';}
function nearAppleUrl(){const place=nearLocation(),item=NEAR.find(n=>n[0]===state.selectedNear);if(!place||!item)return null;return 'https://maps.apple.com/?q='+encodeURIComponent(item[3])+'&sll='+place.lat.toFixed(6)+','+place.lon.toFixed(6)+'&z=15';}
function gps(then){if(!navigator.geolocation){state.gpsError='GPS indisponible sur ce navigateur. Aucune recherche à proximité ne sera lancée.';render();return;}if(state.gpsBusy)return;state.gpsBusy=true;state.gpsError='';render();navigator.geolocation.getCurrentPosition(pos=>{const lat=pos.coords.latitude,lon=pos.coords.longitude,accuracy=pos.coords.accuracy;state.gps={lat,lon,accuracy,when:Date.now(),place:''};state.gpsBusy=false;detectCountry(lat,lon);if(!validPoint(lat,lon))state.gpsError='Coordonnées GPS invalides : nouvelle tentative nécessaire.';else if(!Number.isFinite(accuracy)||accuracy>1500)state.gpsError='Position trop imprécise (environ '+Math.round(accuracy)+' m) pour une recherche à proximité. Réessaie dans un endroit mieux couvert.';else state.gpsError='';render();if(!state.gpsError){toast('📍 GPS prêt : '+lat.toFixed(5)+', '+lon.toFixed(5));if(typeof then==='function')then();}},err=>{state.gpsBusy=false;state.gps=null;state.gpsError=err.code===1?'Accès GPS refusé. Autorise la position de LudoPilot dans les réglages iPhone.':'GPS non disponible. Aucune recherche à proximité ne sera lancée.';render();toast(state.gpsError);},{enableHighAccuracy:true,timeout:16000,maximumAge:0});}

async function copyText(s){try{await navigator.clipboard.writeText(s);toast('Copié.');}catch(_){const ta=byId('questionText');if(ta){ta.value=s;ta.focus();ta.select();toast(document.execCommand('copy')?'Copié.':'Copie indisponible.');}else toast('Copie indisponible sur ce navigateur.');}}
function driverText(s){const t=active(),lang=langFor(t,s),name=destName(s);return `${DRIVER_PHRASES[lang]||DRIVER_PHRASES.en} ${name}${address(s)?'\n'+address(s):''}`;}
function setQuestion(i,preset=0){const t=active();state.questionFree='';state.questionSelected=preset;if(i>=0&&t?.segments?.[i]){t.currentIndex=i;save();state.questionIndex=i;const q=suggestedQuestions(t.segments[i])[preset]||suggestedQuestions(t.segments[i])[0];state.questionText=questionPrompt(t.segments[i],q);}else{state.questionIndex=-1;const q=(NEAR_QUESTIONS[state.selectedNear]||[])[preset]||'Quels établissements fiables se trouvent réellement près de moi ?';state.questionText=nearbyPrompt(q);}setTab('question');}
function updateFormFromDom(){for(const k of Object.keys(state.form)){const el=byId(k);if(el)state.form[k]=el.value;}save();}
async function searchJourney(){updateFormFromDom();const d={...state.form};if(!d.origin.trim()||!d.destination.trim()){toast('Indique le départ et l’arrivée.');return;}if(!state.worker){message('Adresse du moteur absente. Tu peux créer le voyage manuellement, sans frais.','error');return;}if(!state.paidAllowed){message('Recherche intelligente désactivée pour protéger tes crédits. Tu peux l’autoriser dans Réglages.','error');return;}if(!confirm('Cette recherche utilise l’API du moteur LudoPilot et peut consommer tes crédits. Lancer cette recherche ?'))return;if(state.busy)return;state.busy=true;state.notice='Recherche en cours. Patiente sans quitter la page.';state.error='';render();let timeout;try{const ac=new AbortController();timeout=setTimeout(()=>ac.abort(),165000);const url=state.worker.replace(/\/+$/,'')+'/travel-info';const resp=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},signal:ac.signal,body:JSON.stringify({origin:d.origin,destination:d.destination,via:d.via,localDateTime:d.dateTime||new Date().toISOString(),dateTime:d.dateTime||new Date().toISOString(),routePreference:d.preference,transportModes:{allowFerryBoat:true,allowBusShared:true,allowRail:true,allowTaxiGrab:true,allowLocalMotor:true},travelOptions:{}})});const json=await resp.json();if(!resp.ok||!json.ok||!Array.isArray(json.info?.segments))throw Error(json.error||json.details||`Erreur HTTP ${resp.status}`);const info=json.info,ss=info.segments.slice(0,16).map(normalizeSegment);if(!ss.length)throw Error('Aucun segment fourni.');const t=newTrip({...d,summary:info.summary||'',price:info.ranking?.priceText||'',duration:info.ranking?.durationText||'',warnings:info.warnings||[],segments:ss});state.trips.unshift(t);state.trips=state.trips.slice(0,60);state.activeId=t.id;state.notice='Itinéraire reçu et archivé. Vérifie les horaires.';save();setTab('etapes');toast('Voyage sauvegardé dans Archives.');}catch(e){state.error='Erreur de recherche : '+(e.name==='AbortError'?'délai dépassé':String(e.message||e));state.notice=state.error;toast('Recherche impossible, message conservé à l’écran.');}finally{clearTimeout(timeout);state.busy=false;render();}}
function saveWorker(){const raw=byId('worker')?.value.trim()||'';if(!raw){state.worker='';state.paidAllowed=false;save();toast('Moteur désactivé.');return;}try{const u=new URL(raw);if(u.protocol!=='https:'||u.username||u.password||u.search||u.hash)throw Error('URL HTTPS simple obligatoire');state.worker=u.origin+u.pathname.replace(/\/+$/,'').replace(/\/travel-info$/,'');save();toast('Adresse mémorisée. La connexion réelle sera testée lors d’une recherche.');}catch(e){toast('Adresse invalide : '+e.message);}}
function downloadJson(){const blob=new Blob([JSON.stringify({app:'LudoPilot Voyages',version:11,exported:new Date().toISOString(),trips:state.trips,activeId:state.activeId},null,2)],{type:'application/json'});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='LudoPilot-Mes-voyages.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),15000);toast('Sauvegarde à enregistrer dans Fichiers.');}
async function importFile(file){if(!file)return;try{if(file.size>3e6)throw Error('Fichier trop volumineux');const o=JSON.parse(await file.text());if(!Array.isArray(o.trips))throw Error('Format non reconnu');const tr=o.trips.filter(t=>t&&typeof t.origin==='string'&&typeof t.destination==='string'&&Array.isArray(t.segments)).slice(0,60).map(t=>({...newTrip({...t,segments:t.segments.slice(0,16).map(normalizeSegment)}),id:uid(),currentIndex:Math.max(0,Math.min(Number(t.currentIndex)||0,t.segments.length-1))}));if(!tr.length)throw Error('Aucun voyage valide');if(!confirm('Importer '+tr.length+' voyages sans effacer les archives actuelles ?'))return;state.trips=[...tr,...state.trips].slice(0,60);state.activeId=tr[0].id;save();setTab('archives');toast('Voyages importés.');}catch(e){toast('Import impossible : '+e.message);}}
// Suggestions gratuites Photon/OpenStreetMap. Requêtes espacées et limitées ; le serveur public peut refuser ou ralentir.
let geoTimer=null, geoController=null, geoLast=0;const geoCache=new Map();
function scheduleSuggest(id){const el=byId(id),box=byId('suggest-'+id);if(!el||!box)return;clearTimeout(geoTimer);if(geoController)geoController.abort();const q=el.value.trim();if(q.length<4||!navigator.onLine){box.style.display='none';return;}box.style.display='block';box.innerHTML='<div class="smallprint" style="padding:9px">Recherche de lieux gratuits…</div>';geoTimer=setTimeout(()=>loadSuggest(id,q),900);}
async function loadSuggest(id,q){const box=byId('suggest-'+id),el=byId(id);if(!box||!el||el.value.trim()!==q)return;let features=[];if(geoCache.has(q.toLowerCase()))features=geoCache.get(q.toLowerCase());else{try{geoController=new AbortController();const diff=Date.now()-geoLast;if(diff<1000)await new Promise(r=>setTimeout(r,1000-diff));if(geoController.signal.aborted)return;geoLast=Date.now();const resp=await fetch('https://photon.komoot.io/api/?'+new URLSearchParams({q,limit:'5',lang:'en'}),{signal:geoController.signal});if(!resp.ok)throw Error('service indisponible');const d=await resp.json();features=Array.isArray(d.features)?d.features.slice(0,5):[];geoCache.set(q.toLowerCase(),features);if(geoCache.size>35)geoCache.delete(geoCache.keys().next().value);}catch(e){if(e.name==='AbortError')return;box.innerHTML='<div class="smallprint" style="padding:9px">Suggestions indisponibles. Tu peux saisir l’adresse manuellement.</div>';return;}}
if(!byId('suggest-'+id)||byId(id)?.value.trim()!==q)return;box.innerHTML=features.length?features.map((f,i)=>{const p=f.properties||{},label=[p.name,p.street,p.city||p.county,p.state,p.country].filter(Boolean).filter((v,i,a)=>a.indexOf(v)===i).join(', ');return `<button type="button" data-place="${esc(id)}" data-idx="${i}" title="${esc(label)}">📍 ${esc(p.name||p.city||p.country||'Lieu')}<div class="suggest-meta">${esc([p.street,p.city||p.county,p.state,p.country].filter(Boolean).join(', '))}</div></button>`;}).join(''):'<div class="smallprint" style="padding:9px">Aucun résultat. Saisis l’adresse manuellement.</div>';box.style.display='block';box._features=features;}
byId('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b)setTab(b.dataset.tab);});
byId('helpTop').onclick=()=>setTab('aide');byId('settingsTop').onclick=()=>setTab('reglages');
byId('app').addEventListener('submit',e=>{
 if(e.target.id==='bagItemForm'){e.preventDefault();bagSaveItem();}
 if(e.target.id==='bagContainerForm'){e.preventDefault();bagSaveContainer();}
});
byId('app').addEventListener('change',e=>{
 const el=e.target;
 if(el.matches('[data-bag-packed]')){const x=bag.items.find(x=>x.id===el.dataset.bagPacked);if(x){x.packed=el.checked;saveBag();render();}return;}
 if(el.matches('[data-bag-carried]')){const c=bagContainer(el.dataset.bagCarried);if(c){c.carried=el.checked;saveBag();render();}return;}
 if(el.id==='bagImport'){importBag(el.files?.[0]);return;}
});
byId('app').addEventListener('input',e=>{const id=e.target.id;
 if(id==='customEmergencyFr'){
  const oldValue=emergencyMessage.customFr.trim();
  emergencyMessage.customFr=e.target.value.slice(0,500);
  if(oldValue!==emergencyMessage.customFr.trim()){
   emergencyMessage.customLocal='';emergencyMessage.customLang='';emergencyMessage.translatedFor='';
   const local=byId('customEmergencyLocal');if(local)local.value='';
   emergencyMessage.error='';
  }
  saveEmergencyMessage();updateEmergencyPreview();return;
 }
 if(id==='customEmergencyLocal'){
  emergencyMessage.customLocal=e.target.value.slice(0,1000);
  emergencyMessage.customLang=emergencyLanguage().lang;
  emergencyMessage.translatedFor=emergencyMessage.customFr.trim();
  emergencyMessage.error='';saveEmergencyMessage();updateEmergencyPreview();return;
 }
if(Object.hasOwn(state.form,id)){state.form[id]=e.target.value;save();if(['origin','destination','via'].includes(id))scheduleSuggest(id);}if(id==='questionText')state.questionText=e.target.value;if(id==='freeQuestion')state.questionFree=e.target.value;});
byId('app').addEventListener('change',e=>{const id=e.target.id;
 if(id==='showBeeAllergy'){
  emergencyMessage.showAllergy=e.target.checked;saveEmergencyMessage();render();return;
 }
 if(id==='customEmergencyFr'||id==='customEmergencyLocal'){
  saveEmergencyMessage();updateEmergencyPreview();return;
 }
if(id==='tripChooser'){state.activeId=e.target.value;save();render();}if(id==='country'&&COUNTRY[e.target.value]){state.country=e.target.value;state.nearPlace='';state.gps=null;state.gpsError='';save();render();}if(id==='paidAllowed'){if(e.target.checked){if(!confirm('Autoriser des recherches utilisant potentiellement tes crédits OpenAI ?')){e.target.checked=false;state.paidAllowed=false;}else state.paidAllowed=true;}else state.paidAllowed=false;save();}if(id==='preference'){state.form.preference=e.target.value;save();}if(id==='driverLang'){state.driverLang=e.target.value;save();render();}if(id==='importFile')importFile(e.target.files[0]);});
byId('app').addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.bagNew){bagEditorOpen('item',null,b.dataset.bagNew);return;}
 if(b.dataset.bagEdit){bagEditorOpen('item',b.dataset.bagEdit);return;}
 if(b.dataset.bagNewContainer){bagEditorOpen('container');return;}
 if(b.dataset.bagEditContainer){bagEditorOpen('container',b.dataset.bagEditContainer);return;}
 if(b.dataset.bagCancel){bagEditorClose();return;}
 if(b.dataset.bagDelete){if(confirm('Supprimer cette affaire ?')){bag.items=bag.items.filter(x=>x.id!==b.dataset.bagDelete);saveBag();bagEditorClose();}return;}
 if(b.dataset.bagDelContainer){const id=b.dataset.bagDelContainer;if(confirm('Supprimer ce contenant ? Ses affaires seront déplacées dans « Sur moi ».')){bag.items.filter(x=>x.container===id).forEach(x=>x.container='onBody');bag.containers=bag.containers.filter(x=>x.id!==id);saveBag();bagEditorClose();}return;}
 if(b.id==='exportBag'){downloadBag();return;}
 if(b.id==='importBagButton'){byId('bagImport')?.click();return;}

 if(b.dataset.emergencyMode){
  if(emergencyMessage.mode!==b.dataset.emergencyMode){
   emergencyScenario.chosen.medical=null;emergencyScenario.chosen.agression=null;
   emergencyScenario.expanded=false;
  }
  emergencyMessage.mode=b.dataset.emergencyMode;emergencyMessage.error='';
  saveEmergencyMessage();render();return;
 }
 if(b.dataset.emergencyScenario){
  const mode=emergencyMessage.mode;
  if(!(EMERGENCY_SCENARIOS[mode]||[]).some(x=>x[0]===b.dataset.emergencyScenario))return;
  emergencyScenario.chosen[mode]=b.dataset.emergencyScenario;
  render();return;
 }
 if(b.id==='toggleEmergencyScenarios'){
  emergencyScenario.expanded=!emergencyScenario.expanded;
  render();return;
 }
 if(b.id==='translateEmergency'){
  // La saisie est enregistrée par le gestionnaire input.
  await translateEmergencyMessage();return;
 }
 if(b.id==='copyEmergencyMessage'){
  const msg=emergencyCurrentText();if(msg.local)await copyText(msg.local);return;
 }
if(b.dataset.tab){setTab(b.dataset.tab);return;}if(b.dataset.place){const box=byId('suggest-'+b.dataset.place),f=box?._features?.[Number(b.dataset.idx)];if(!f)return;const p=f.properties||{};const label=[p.name,p.street,p.city||p.county,p.state,p.country].filter(Boolean).filter((v,i,a)=>a.indexOf(v)===i).join(', ');state.form[b.dataset.place]=label;byId(b.dataset.place).value=label;box.style.display='none';save();return;}if(b.dataset.choose!==undefined){const t=active();if(t){t.currentIndex=Number(b.dataset.choose);t.complete=false;save();render();}return;}if(b.dataset.load){state.activeId=b.dataset.load;save();setTab('etapes');return;}if(b.dataset.rename){const t=state.trips.find(x=>x.id===b.dataset.rename);if(t){const n=prompt('Nom du voyage',t.name||t.destination);if(n!==null&&n.trim()){t.name=n.trim().slice(0,80);save();render();}}return;}if(b.dataset.clone){const t=state.trips.find(x=>x.id===b.dataset.clone);if(t){const copy=JSON.parse(JSON.stringify(t));copy.id=uid();copy.name=(t.name||t.destination)+' (copie)';copy.created=new Date().toISOString();state.trips.unshift(copy);state.activeId=copy.id;save();render();toast('Copie ajoutée aux archives.');}return;}if(b.dataset.driver!==undefined){const t=active();if(t){t.currentIndex=Number(b.dataset.driver);save();setTab('chauffeur');}return;}if(b.dataset.map!==undefined){const t=active();if(t?.segments?.[Number(b.dataset.map)])openURL(mapUrl(t.segments[Number(b.dataset.map)]));return;}if(b.dataset.question!==undefined){setQuestion(Number(b.dataset.question));return;}if(b.dataset.placeRoute){const [kind,rawIndex]=b.dataset.placeRoute.split(':');const list=kind==='near'?nearItems:displayedSafetyPlaces();const url=routeToPlace(list[Number(rawIndex)],'walking',kind);if(url)openURL(url);else toast('Itinéraire bloqué : GPS ou proximité non confirmé.');return;}if(b.dataset.near){searchNearCategory(b.dataset.near);return;}if(b.dataset.nearSuggest!==undefined){if(!nearLocation()){state.gpsError='Position GPS non disponible. Choisis à nouveau le thème pour lancer la localisation.';render();return;}setQuestion(-1,Number(b.dataset.nearSuggest));return;}if(b.dataset.suggest!==undefined){const idx=Number(b.dataset.suggest);const near=state.questionIndex<0;const q=near?(NEAR_QUESTIONS[state.selectedNear]||[])[idx]:currentSegment()?suggestedQuestions(currentSegment())[idx]:null;if(q){state.questionSelected=idx;state.questionText=near?nearbyPrompt(q):questionPrompt(currentSegment(),q);render();}return;}
const t=active();switch(b.id){case'createJourney':updateFormFromDom();createJourney();break;case'searchJourney':await searchJourney();break;case'addSegment':addSegment();break;case'prevSegment':advance(-1);break;case'nextSegment':advance(1);break;case'mapCurrent':if(currentSegment())openURL(mapUrl(currentSegment()));break;case'copyDriver':if(currentSegment())await copyText(driverText(currentSegment()));break;case'getGPS':gps();break;case'retryNear':searchNearCategory(state.selectedNear);break;case'refreshSafety':safety.reqId++;safety.busy=false;safety.loading=false;state.gps=null;loadSafetyFromGps();break;case'shareGPS':if(!state.gps)gps();else await copyText(`Ma position GPS : https://www.google.com/maps/search/?api=1&query=${state.gps.lat},${state.gps.lon}`);break;case'showGPSmap':if(state.gps)openURL('https://www.google.com/maps/search/?api=1&query='+state.gps.lat+','+state.gps.lon);else gps(()=>openURL('https://www.google.com/maps/search/?api=1&query='+state.gps.lat+','+state.gps.lon));break;case'openNearMap':{const u=nearUrl();if(!u){state.gpsError='Position GPS non disponible. Sélectionne à nouveau le thème.';render();break;}openURL(u);break;}case'openNearApple':{const u=nearAppleUrl();if(!u){state.gpsError='Position GPS non disponible. Sélectionne à nouveau le thème.';render();break;}openURL(u);break;}case'nearQuestion':if(nearLocation())setQuestion(-1);else{state.gpsError='Sélectionne à nouveau le thème pour actualiser ta position avant ta question.';render();}break;case'prepareFreeQuestion':{const q=state.questionFree.trim();if(!q){toast('Écris d’abord ta question.');break;}if(state.questionIndex<0){if(!nearLocation()){toast('GPS expiré : choisis à nouveau le thème pour relocaliser l’iPhone.');break;}state.questionText=nearbyPrompt(q);}else if(currentSegment())state.questionText=questionPrompt(currentSegment(),q);state.questionSelected=-1;render();toast('Question libre préparée.');break;}case'copyQuestion':await copyText(state.questionText);break;case'saveWorker':saveWorker();break;case'export':downloadJson();break;case'importButton':byId('importFile')?.click();break;case'deleteTrip':if(t&&confirm('Supprimer définitivement ce voyage local ?')){state.trips=state.trips.filter(x=>x.id!==t.id);state.activeId=state.trips[0]?.id||null;save();setTab('archives');}break;}});
window.addEventListener('online',()=>{if(state.tab==='voyage')render();});
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
render();
if(navigator.permissions?.query){navigator.permissions.query({name:'geolocation'}).then(p=>{
 if(p.state==='granted'&&!safety.busy&&!safety.loading)loadSafetyFromGps();
}).catch(()=>{});}
})();

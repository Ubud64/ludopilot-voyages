const NEAR=[['bank','🏦','Banques et DAB','ATM bank'],['change','💱','Bureaux de change','money exchange'],['supermarket','🛒','Supermarchés','supermarket'],['food','🍜','Restaurants','restaurant'],['streetfood','🥟','Street food','street food'],['nightmarket','🌙','Marchés de nuit','night market'],['market','🥭','Marchés locaux','market'],['massage','💆','Massages','massage'],['phone','📱','Téléphonie / SIM','mobile phone shop'],['laundry','🧺','Laveries','laundry'],['pharmacy','💊','Pharmacies','pharmacy'],['taxi','🚕','Transports','taxi stand']];
// Questions courantes adaptées à chaque thème, sans requête API.
const NEAR_QUESTIONS={
 bank:['Quels distributeurs fiables sont les plus proches et quels frais de retrait prévoir ?','Quels DAB acceptent les cartes internationales et quels plafonds appliquent-ils ?','Quelles banques sont ouvertes maintenant, avec accès facile à pied ?','Quels conseils pour éviter les frais de conversion dynamique au distributeur ?'],

 supermarket:['Quels supermarchés sont accessibles à pied et ouverts actuellement ?','Quel supermarché est le plus intéressant pour des produits courants à petit prix ?','Où acheter de l’eau, des fruits frais et des produits locaux à proximité ?','Quels magasins proposent des produits frais et des horaires fiables ?'],

 streetfood:['Où sont les stands de street food locale les plus proches, avec de bons avis récents ?','Quelles spécialités de rue faut-il goûter ici, et à quel prix approximatif ?','Quels stands sont ouverts actuellement et faciles à atteindre à pied ?','Comment repérer un stand de street food avec de bonnes pratiques d’hygiène ?'],
 nightmarket:['Quels marchés de nuit proches de ma position sont ouverts ce soir ?','Quels marchés nocturnes proposent le plus de nourriture locale à petit prix ?','Quels sont les horaires, jours d’ouverture et accès à pied de ces marchés ?','Quel marché de nuit vaut le plus le détour ce soir, sans long trajet ?'],
 market:['Quels marchés locaux de produits frais sont les plus proches ?','À quelles heures ouvrent-ils et quels jours ont lieu les grands marchés ?','Où trouver fruits, légumes et spécialités locales à bon prix ?','Quels marchés sont faciles à visiter à pied depuis ma position ?'],
 massage:['Quels salons de massage sérieux et bien évalués se trouvent à proximité immédiate ?','Quels tarifs réels pour un massage traditionnel de 60 minutes ?','Quels salons sont ouverts maintenant et acceptent les clients sans réservation ?','Comment distinguer un véritable institut de massage d’un établissement ambigu ?'],
 phone:['Où trouver la boutique officielle de téléphonie la plus proche ?','Où acheter ou recharger une SIM locale sans frais excessifs ?','Quels documents sont nécessaires pour activer une SIM touristique ?','Quelles boutiques sont ouvertes maintenant et peuvent m’aider en anglais ?'],
 laundry:['Quelles laveries fiables sont accessibles à pied et ouvertes aujourd’hui ?','Quel est le prix d’une lessive avec séchage et sous quel délai ?','Y a-t-il un service de lavage au kilo à proximité ?','Quelles laveries offrent un dépôt et retrait des vêtements le même jour ?'],
 pharmacy:['Quelles pharmacies sont ouvertes maintenant à proximité immédiate ?','Où trouver une pharmacie de garde ou ouverte tard ce soir ?','Quelles pharmacies proposent un pharmacien parlant anglais ?','Quels renseignements demander pour trouver un médicament équivalent localement ?'],
 taxi:['Où se trouve le point de prise en charge taxi ou VTC le plus proche ?','Quelles applications de transport sont fiables dans cette ville ?','Quel tarif habituel pour rejoindre le centre-ville ou le prochain terminal ?','Comment éviter les fausses courses, les suppléments et les arnaques ?']
};
const DRIVER_LANGS={auto:'Automatique',en:'English',th:'ไทย · Thaï',fil:'Filipino · Tagalog',id:'Bahasa Indonesia',es:'Español',fr:'Français'};
const DRIVER_PHRASES={en:'Please take me to',th:'กรุณาพาไปที่',fil:'Pakihatid po ako sa',id:'Tolong antar saya ke',es:'Por favor, lléveme a',fr:'Veuillez me conduire à'};
const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const byId=id=>document.getElementById(id);const uid=()=>crypto?.randomUUID?.()||String(Date.now())+Math.random();
// Conversion gratuite des montants visibles, sans cle API payante.
const FX_STORAGE='ludopilot-voyages-eur-fx-v1';
const fx={rates:null,date:'',fetchedAt:0,busy:false,attemptedAt:0,error:false};
try{const saved=JSON.parse(localStorage.getItem(FX_STORAGE)||'null');if(saved?.rates&&typeof saved.rates==='object'&&/^\d{4}-\d{2}-\d{2}$/.test(saved.date||'')){fx.rates=saved.rates;fx.date=saved.date;fx.fetchedAt=Number(saved.fetchedAt)||0;}}catch(_){ }
// Currencies les plus courantes pour nos voyages ; le reste demeure affiche sans taux invente.
const FX_CODES=['PHP','THB','IDR','MUR','USD','GBP','JPY','KRW','VND','MYR','SGD','AUD','CAD','CHF','CNY','HKD','TWD','NZD','INR','KHR','LAK','MMK','EUR'];
const AMOUNT_RE='(?:\\d{1,3}(?:[\\s\\u00a0\\u202f.,]\\d{3})+(?:[.,]\\d{1,2})?|\\d+(?:[.,]\\d{1,2})?)';
const MONEY_RE=new RegExp('(?<![A-Za-z0-9])((?:'+FX_CODES.join('|')+'|PhP|US\\$|₱|฿|₫|Rp\\.?|₩|₹|£|¥|\\$|Rs\\.?)\\s*)('+AMOUNT_RE+')|(?<![A-Za-z0-9])('+AMOUNT_RE+')\\s*('+FX_CODES.join('|')+'|pesos?|baht|rupiahs?|roupies?|ringgits?|dollars?)(?![A-Za-z])','gi');
const euroFormatter=new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',minimumFractionDigits:2,maximumFractionDigits:2});
function currencyCode(token){const s=String(token||'').trim().replace(/\.$/,'').toLowerCase();
 if(s==='₱'||s==='php'||s==='peso'||s==='pesos'||s==='php')return'PHP';
 if(s==='฿'||s==='thb'||s==='baht')return'THB';
 if(s==='rp'||s==='idr'||s==='rupiah'||s==='rupiahs')return'IDR';
 if(s==='rs'||s==='mur'||s==='roupie'||s==='roupies')return state.country==='MU'||s==='mur'?'MUR':null;
 if(s==='₫'||s==='vnd')return'VND';if(s==='₩'||s==='krw')return'KRW';if(s==='₹'||s==='inr')return'INR';
 if(s==='£'||s==='gbp')return'GBP';if(s==='¥')return'JPY';if(s==='us$'||s==='$'||s==='dollar'||s==='dollars')return'USD';
 if(s==='ringgit'||s==='ringgits')return'MYR';return FX_CODES.includes(s.toUpperCase())?s.toUpperCase():null;
}
function parseLocalAmount(raw){let s=String(raw||'').replace(/[\u00a0\u202f\s]/g,'');const comma=s.lastIndexOf(','),dot=s.lastIndexOf('.');if(comma>=0&&dot>=0){const dec=comma>dot?',':'.';s=s.replace(dec===','?/\./g:/,/g,'').replace(dec,'.');}
 else if(comma>=0||dot>=0){const sep=comma>=0?',':'.';const parts=s.split(sep);if(parts.length>2||parts.length===2&&parts[1].length===3&&parts[0].length<=3){s=parts.join('');}else if(sep===',')s=s.replace(',','.');}
 const val=Number(s);return Number.isFinite(val)&&val>=0?val:null;}
function hasFreshFx(){return !!(fx.rates&&fx.date&&Number.isFinite(Date.parse(fx.date+'T00:00:00Z'))&&Date.now()-Date.parse(fx.date+'T00:00:00Z')<32*86400000);}
function annotatePrices(raw){return String(raw??'').replace(MONEY_RE,(whole,prefix,frontNum,backNum,suffix,offset,original)=>{
 const token=prefix||suffix,code=currencyCode(token);if(!code||code==='EUR')return whole;
 const val=parseLocalAmount(frontNum||backNum);if(val===null)return whole;
 if(/^\s*\(\s*(?:≈|~)?\s*\d[\d\s.,]*\s*€/.test(original.slice(offset+whole.length)))return whole;
 const rate=fx.rates&&Number(fx.rates[code.toLowerCase()]);
 if(hasFreshFx()&&Number.isFinite(rate)&&rate>0)return whole+' (≈ '+euroFormatter.format(val/rate)+')';
 return whole;
 });}
function moneyHtml(value){const s=String(value??'');return '<span class="money-display" data-money="'+esc(s)+'">'+esc(annotatePrices(s))+'</span>';}
function updateMoneyNodes(){document.querySelectorAll('[data-money]').forEach(el=>{el.textContent=annotatePrices(el.dataset.money);});const note=byId('fxInfo');if(note)note.remove();}
async function ensureFxRates(){if(fx.busy||fx.attemptedAt&&Date.now()-fx.attemptedAt<60000)return;if(hasFreshFx()&&Date.now()-fx.fetchedAt<12*3600000)return;if(!navigator.onLine){fx.error=!hasFreshFx();updateMoneyNodes();return;}
 fx.busy=true;fx.error=false;fx.attemptedAt=Date.now();updateMoneyNodes();
 const urls=['https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/eur.min.json','https://latest.currency-api.pages.dev/v1/currencies/eur.min.json'];
 try{let result=null;for(const url of urls){const ac=new AbortController(),timer=setTimeout(()=>ac.abort(),8500);try{const r=await fetch(url,{signal:ac.signal,cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const j=await r.json();if(!j?.eur||!/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(j.date||'')||!Number.isFinite(Number(j.eur.php))||!Number.isFinite(Number(j.eur.thb)))throw Error('Taux non valides');result=j;break;}catch(_){ }finally{clearTimeout(timer);}}

function distanceMeters(lat1,lon1,lat2,lon2){

function osmPlaces(elements,lat,lon,radius){

  const name=String(el.tags?.['name:fr']||el.tags?.name||el.tags?.['name:en']||el.tags?.brand||'').trim();
  if(!name||!validPoint(a,b))return null;
  const distance=distanceMeters(lat,lon,a,b);
  if(distance>radius+200)return null;
  return {name,lat:a,lon:b,distance};
 }).filter(Boolean).sort((a,b)=>a.distance-b.distance).filter(x=>{
  const k=x.name.toLocaleLowerCase()+'|'+x.lat.toFixed(4)+'|'+x.lon.toFixed(4);
  if(seen.has(k))return false;seen.add(k);return true;
 });

async function findSafetyCategories(lat,lon,onBatch){

byId('app').addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab){setTab(b.dataset.tab);return;}if(b.dataset.place){const box=byId('suggest-'+b.dataset.place),f=box?._features?.[Number(b.dataset.idx)];if(!f)return;const p=f.properties||{};const label=[p.name,p.street,p.city||p.county,p.state,p.country].filter(Boolean).filter((v,i,a)=>a.indexOf(v)===i).join(', ');state.form[b.dataset.place]=label;byId(b.dataset.place).value=label;box.style.display='none';save();return;}if(b.dataset.choose!==undefined){const t=active();if(t){t.currentIndex=Number(b.dataset.choose);t.complete=false;save();render();}return;}if(b.dataset.load){state.activeId=b.dataset.load;save();setTab('etapes');return;}if(b.dataset.rename){const t=state.trips.find(x=>x.id===b.dataset.rename);if(t){const n=prompt('Nom du voyage',t.name||t.destination);if(n!==null&&n.trim()){t.name=n.trim().slice(0,80);save();render();}}return;}if(b.dataset.clone){const t=state.trips.find(x=>x.id===b.dataset.clone);if(t){const copy=JSON.parse(JSON.stringify(t));copy.id=uid();copy.name=(t.name||t.destination)+' (copie)';copy.created=new Date().toISOString();state.trips.unshift(copy);state.activeId=copy.id;save();render();toast('Copie ajoutée aux archives.');}return;}if(b.dataset.driver!==undefined){const t=active();if(t){t.currentIndex=Number(b.dataset.driver);save();setTab('chauffeur');}return;}if(b.dataset.map!==undefined){const t=active();if(t?.segments?.[Number(b.dataset.map)])openURL(mapUrl(t.segments[Number(b.dataset.map)]));return;}if(b.dataset.question!==undefined){setQuestion(Number(b.dataset.question));return;}if(b.dataset.placeRoute){const [kind,rawIndex]=b.dataset.placeRoute.split(':');const list=kind==='near'?nearItems:safety.all;const url=routeToPlace(list[Number(rawIndex)],'walking',kind);if(url)openURL(url);else toast('Itinéraire bloqué : GPS ou proximité non confirmé.');return;}if(b.dataset.near){searchNearCategory(b.dataset.near);return;}if(b.dataset.nearSuggest!==undefined){if(!nearLocation()){state.gpsError='Position GPS non disponible. Choisis à nouveau le thème pour lancer la localisation.';render();return;}setQuestion(-1,Number(b.dataset.nearSuggest));return;}if(b.dataset.suggest!==undefined){const idx=Number(b.dataset.suggest);const near=state.questionIndex<0;const q=near?(NEAR_QUESTIONS[state.selectedNear]||[])[idx]:currentSegment()?suggestedQuestions(currentSegment())[idx]:null;if(q){state.questionSelected=idx;state.questionText=near?nearbyPrompt(q):questionPrompt(currentSegment(),q);render();}return;}
const t=active();switch(b.id){case'createJourney':updateFormFromDom();createJourney();break;case'searchJourney':await searchJourney();break;case'addSegment':addSegment();break;case'prevSegment':advance(-1);break;case'nextSegment':advance(1);break;case'mapCurrent':if(currentSegment())openURL(mapUrl(currentSegment()));break;case'copyDriver':if(currentSegment())await copyText(driverText(currentSegment()));break;case'getGPS':gps();break;case'retryNear':searchNearCategory(state.selectedNear);break;case'refreshSafety':safety.reqId++;safety.busy=false;safety.loading=false;state.gps=null;loadSafetyFromGps();break;case'shareGPS':if(!state.gps)gps();else await copyText(`Ma position GPS : https://www.google.com/maps/search/?api=1&query=${state.gps.lat},${state.gps.lon}`);break;case'showGPSmap':if(state.gps)openURL('https://www.google.com/maps/search/?api=1&query='+state.gps.lat+','+state.gps.lon);else gps(()=>openURL('https://www.google.com/maps/search/?api=1&query='+state.gps.lat+','+state.gps.lon));break;case'openNearMap':{const u=nearUrl();if(!u){state.gpsError='Position GPS non disponible. Sélectionne à nouveau le thème.';render();break;}openURL(u);break;}case'openNearApple':{const u=nearAppleUrl();if(!u){state.gpsError='Position GPS non disponible. Sélectionne à nouveau le thème.';render();break;}openURL(u);break;}case'nearQuestion':if(nearLocation())setQuestion(-1);else{state.gpsError='Sélectionne à nouveau le thème pour actualiser ta position avant ta question.';render();}break;case'prepareFreeQuestion':{const q=state.questionFree.trim();if(!q){toast('Écris d’abord ta question.');break;}if(state.questionIndex<0){if(!nearLocation()){toast('GPS expiré : choisis à nouveau le thème pour relocaliser l’iPhone.');break;}state.questionText=nearbyPrompt(q);}else if(currentSegment())state.questionText=questionPrompt(currentSegment(),q);state.questionSelected=-1;render();toast('Question libre préparée.');break;}case'copyQuestion':await copyText(state.questionText);break;case'saveWorker':saveWorker();break;case'export':downloadJson();break;case'importButton':byId('importFile')?.click();break;case'deleteTrip':if(t&&confirm('Supprimer définitivement ce voyage local ?')){state.trips=state.trips.filter(x=>x.id!==t.id);state.activeId=state.trips[0]?.id||null;save();setTab('archives');}break;}});
window.addEventListener('online',()=>{if(state.tab==='voyage')render();});
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
render();
if(navigator.permissions?.query){navigator.permissions.query({name:'geolocation'}).then(p=>{
 if(p.state==='granted'&&!safety.busy&&!safety.loading)loadSafetyFromGps();
}).catch(()=>{});}
})();
</script>
</body>

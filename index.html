<style>

*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.48 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;padding-bottom:calc(88px + env(safe-area-inset-bottom))}button,input,select,textarea{font:inherit}button{cursor:pointer}
.top{background:#102b44;color:white;padding:calc(11px + env(safe-area-inset-top)) 15px 12px}.top-line{max-width:720px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:8px}.brand{font-size:20px;font-weight:900}.subbrand{font-size:10px;opacity:.75;letter-spacing:1px;font-weight:800}.top-actions{display:flex;gap:6px;align-items:center}.headbtn{background:#ffffff1c;color:white;border:1px solid #ffffff44;border-radius:9px;padding:7px 9px;min-height:35px;font-size:13px}
main{max-width:720px;margin:auto;padding:16px 13px}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 4px 15px #16446009}h1{font-size:25px;line-height:1.2;letter-spacing:-.4px;margin:0 0 8px}h2{font-size:18px;margin:0 0 10px}h3{font-size:16px;margin:0 0 7px}p{margin:0 0 11px}.eyebrow{font-size:11px;color:var(--accent);font-weight:850;letter-spacing:1.2px;text-transform:uppercase}.subtitle,.muted{color:var(--muted)}.subtitle{font-size:13px}.smallprint{color:var(--muted);font-size:12px}
label{display:block;font-size:13px;font-weight:750;margin:12px 0 5px}.field{display:block;width:100%;border:1px solid #cbd9e2;border-radius:10px;background:white;color:var(--ink);min-height:45px;padding:11px;font-size:16px}.field:focus{outline:2px solid #85c9e4;outline-offset:1px}textarea.field{min-height:110px;resize:vertical}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.btn{background:var(--blue);border:0;border-radius:11px;color:white;font-weight:790;min-height:45px;padding:11px 13px;text-align:center;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}.btn.secondary{background:#e8f2f8;color:#0e668e}.btn.ghost{background:white;color:#244c65;border:1px solid #cbd9e2}.btn.teal{background:var(--accent)}.btn.danger{background:#fff0f0;color:#9c2929}.btn.small{font-size:13px;padding:8px 11px;min-height:36px}.btn:disabled{opacity:.5}.wide{width:100%}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:9px 0}.actions>.btn{flex:1;min-width:130px}.callout{padding:11px 13px;background:#edf8f7;border-left:3px solid var(--accent);border-radius:9px;color:#305e61;font-size:13px;margin:10px 0}.warning{background:#fff4e7;border-left-color:#b87618;color:#814b12}.error{background:#fff1f1;border-left-color:var(--red);color:#802b2b}.status{padding:11px;background:#eaf4f8;border-radius:10px;font-size:13px;margin:10px 0}.pill{display:inline-block;background:#e7f4f8;color:#206c87;border-radius:40px;font-size:12px;padding:4px 8px;font-weight:750}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.step{border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}.step.active{border:2px solid var(--accent);padding:11px;background:#f7fffd}.step-title{font-size:15px;font-weight:850}.meta{color:var(--muted);font-size:13px;margin:6px 0}.facts{padding-left:19px;margin:9px 0;font-size:13px}.facts li{margin-bottom:4px}.divider{height:1px;background:var(--line);margin:13px 0}
nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:white;border-top:1px solid var(--line);padding:7px 4px calc(6px + env(safe-area-inset-bottom));z-index:10;box-shadow:0 -4px 14px #16446009}nav button{background:transparent;border:0;color:#627588;font-size:10.5px;font-weight:800;display:grid;justify-items:center;gap:2px;padding:5px 2px;border-radius:10px}nav button.active{background:#eaf4fa;color:var(--blue)}nav button .icon{font-size:22px;line-height:1.25}
#toast{position:fixed;z-index:20;bottom:calc(92px + env(safe-area-inset-bottom));left:14px;right:14px;max-width:620px;margin:auto;background:#173b50;color:white;border-radius:11px;padding:11px 14px;text-align:center;display:none;box-shadow:0 6px 25px #0003}.suggestions{margin-top:3px;border:1px solid #cee0e8;background:#fff;border-radius:11px;overflow:hidden;box-shadow:0 5px 14px #16446017}.suggestions button{width:100%;text-align:left;background:#fff;color:var(--ink);border:0;border-bottom:1px solid var(--line);padding:11px 12px;line-height:1.35}.suggestions button:last-child{border-bottom:none}.suggestions .suggest-meta{font-size:11px;color:var(--muted)}.near-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.placebtn{min-height:82px;border:1px solid var(--line);border-radius:13px;padding:12px;background:white;color:var(--ink);text-align:center;font-weight:800;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px}.placebtn .emoji{font-size:26px}.placebtn:disabled{cursor:wait}.placebtn.selected{border:3px solid var(--accent);padding:10px;background:#e4f7f2;color:#06665f;box-shadow:0 0 0 2px #c4eee6 inset}.placebtn.selected::after{content:'✓ Sélectionné';font-size:12px;font-weight:900;color:#056b64}.driver-place{text-align:center;font-size:clamp(26px,8vw,43px);overflow-wrap:anywhere;font-weight:900;margin:20px 0}.driver-translation{text-align:center;font-size:22px;font-weight:800;margin:12px 0}.driver-caption{text-align:center;letter-spacing:1px;color:var(--accent);font-size:12px;font-weight:850}.driver-address{text-align:center;color:var(--muted);overflow-wrap:anywhere}.questionbtn{text-align:left;width:100%;margin:5px 0;justify-content:flex-start;line-height:1.35;white-space:normal}.questionbtn.selected{background:#e4f7f2;border:2px solid var(--accent);color:#06665f}.questionbtn:disabled{opacity:.55}.question-tip{margin-top:10px;color:var(--muted);font-size:12px}.archive-title{font-size:16px;font-weight:800}.help-number{font-size:26px;font-weight:900}.help-red{background:#b62e39;color:white}.help-red .subtitle{color:#ffedf0}.link{color:var(--blue);word-wrap:anywhere}.line-check{display:flex;align-items:flex-start;gap:9px;font-size:13px}.line-check input{margin-top:4px;accent-color:var(--accent)}
@media(max-width:365px){.grid2{grid-template-columns:1fr}.actions>.btn{min-width:110px}.top{padding-left:9px;padding-right:9px}.brand{font-size:18px}main{padding:13px 10px}}@media print{.top,nav,.actions,.btn{display:none!important}body{padding:0;background:white}.card{border:none}}
</style>

<body>
<header class="top"><div class="top-line"><div><div class="brand">🧭 LudoPilot <span style="color:#66d7cf">Voyages</span></div><div class="subbrand">V1.4 · SIMPLE ET ÉCONOMIQUE</div></div><div class="top-actions"><button id="helpTop" class="headbtn" aria-label="Aide-moi">🆘</button><button id="settingsTop" class="headbtn" aria-label="Réglages">⚙️</button></div></div></header>
<main id="app"></main>
<nav id="tabs" aria-label="Navigation"><button data-tab="voyage"><span class="icon">🧭</span>Voyage</button><button data-tab="etapes"><span class="icon">🗺️</span>Étapes</button><button data-tab="archives"><span class="icon">📂</span>Archives</button><button data-tab="proche"><span class="icon">📍</span>Proche</button><button data-tab="aide"><span class="icon">🆘</span>Aide-moi</button></nav>
<div id="toast" role="status" aria-live="polite"></div>
<script>
(()=>{
'use strict';
// Les données de V1 sont conservées : ne jamais renommer cette clé.
const STORE='ludopilot-voyages-v1', PREF='ludopilot-voyages-v11-prefs';
const MODES={walk:'🚶 Marche',bicycle:'🚲 Vélo',motorbike:'🛵 Moto-taxi',tricycle:'🛺 Tricycle',tuktuk:'🛺 Tuk-tuk',taxi:'🚕 Taxi',grab:'🚙 Grab',jeepney:'🚌 Jeepney',minibus:'🚐 Minibus',bus:'🚌 Bus',coach:'🚌 Autocar',van:'🚐 Van',train:'🚆 Train',metro:'🚇 Métro',ferry:'⛴️ Ferry',boat:'🚤 Bateau',plane:'✈️ Avion',other:'📍 Autre'};
const COUNTRY={PH:{label:'Philippines',currency:'PHP',emergencies:[['Urgences (police, secours, ambulance)','911']]},TH:{label:'Thaïlande',currency:'THB',emergencies:[['Police','191'],['Ambulance','1669'],['Pompiers','199'],['Police touristique','1155']]},ID:{label:'Indonésie',currency:'IDR',emergencies:[['Police','110'],['Ambulance','119'],['Numéro d’urgence général','112']]},FR:{label:'France',currency:'EUR',emergencies:[['Urgences européennes','112'],['SAMU','15'],['Police','17'],['Pompiers','18']]},ES:{label:'Espagne',currency:'EUR',emergencies:[['Urgences','112']]},MU:{label:'Île Maurice',currency:'MUR',emergencies:[['Police','999'],['SAMU','114'],['Pompiers','115']]},OTHER:{label:'Autre pays',emergencies:[]}};
const NEAR=[['bank','🏦','Banques et DAB','ATM bank'],['change','💱','Bureaux de change','money exchange'],['supermarket','🛒','Supermarchés','supermarket'],['food','🍜','Restaurants','restaurant'],['streetfood','🥟','Street food','street food'],['nightmarket','🌙','Marchés de nuit','night market'],['market','🥭','Marchés locaux','market'],['massage','💆','Massages','massage'],['phone','📱','Téléphonie / SIM','mobile phone shop'],['laundry','🧺','Laveries','laundry'],['pharmacy','💊','Pharmacies','pharmacy'],['taxi','🚕','Transports','taxi stand']];
// Questions courantes adaptées à chaque thème, sans requête API.
const NEAR_QUESTIONS={
 bank:['Quels distributeurs fiables sont les plus proches et quels frais de retrait prévoir ?','Quels DAB acceptent les cartes internationales et quels plafonds appliquent-ils ?','Quelles banques sont ouvertes maintenant, avec accès facile à pied ?','Quels conseils pour éviter les frais de conversion dynamique au distributeur ?'],
 change:['Quels bureaux de change sérieux sont les plus proches et quels taux EUR/monnaie locale affichent-ils ?','Quels frais ou commissions faut-il comparer avant de changer des euros ?','Quels bureaux sont ouverts aujourd’hui et quels documents faut-il présenter ?','Comment comparer le taux proposé au taux de référence actuel ?'],
 supermarket:['Quels supermarchés sont accessibles à pied et ouverts actuellement ?','Quel supermarché est le plus intéressant pour des produits courants à petit prix ?','Où acheter de l’eau, des fruits frais et des produits locaux à proximité ?','Quels magasins proposent des produits frais et des horaires fiables ?'],
 food:['Quels restaurants locaux bien notés et bon marché sont accessibles à pied ?','Où manger un plat traditionnel dans un établissement propre à proximité ?','Quels restaurants sont ouverts maintenant et à quel prix moyen ?','Quelles bonnes adresses non touristiques sont réellement proches de moi ?'],
 streetfood:['Où sont les stands de street food locale les plus proches, avec de bons avis récents ?','Quelles spécialités de rue faut-il goûter ici, et à quel prix approximatif ?','Quels stands sont ouverts actuellement et faciles à atteindre à pied ?','Comment repérer un stand de street food avec de bonnes pratiques d’hygiène ?'],
 nightmarket:['Quels marchés de nuit proches de ma position sont ouverts ce soir ?','Quels marchés nocturnes proposent le plus de nourriture locale à petit prix ?','Quels sont les horaires, jours d’ouverture et accès à pied de ces marchés ?','Quel marché de nuit vaut le plus le détour ce soir, sans long trajet ?'],
 market:['Quels marchés locaux de produits frais sont les plus proches ?','À quelles heures ouvrent-ils et quels jours ont lieu les grands marchés ?','Où trouver fruits, légumes et spécialités locales à bon prix ?','Quels marchés sont faciles à visiter à pied depuis ma position ?'],
 massage:['Quels salons de massage sérieux et bien évalués se trouvent à proximité immédiate ?','Quels tarifs réels pour un massage traditionnel de 60 minutes ?','Quels salons sont ouverts maintenant et acceptent les clients sans réservation ?','Comment distinguer un véritable institut de massage d’un établissement ambigu ?'],
 phone:['Où trouver la boutique officielle de téléphonie la plus proche ?','Où acheter ou recharger une SIM locale sans frais excessifs ?','Quels documents sont nécessaires pour activer une SIM touristique ?','Quelles boutiques sont ouvertes maintenant et peuvent m’aider en anglais ?'],
 laundry:['Quelles laveries fiables sont accessibles à pied et ouvertes aujourd’hui ?','Quel est le prix d’une lessive avec séchage et sous quel délai ?','Y a-t-il un service de lavage au kilo à proximité ?','Quelles laveries offrent un dépôt et retrait des vêtements le même jour ?'],
 pharmacy:['Quelles pharmacies sont ouvertes maintenant à proximité immédiate ?','Où trouver une pharmacie de garde ou ouverte tard ce soir ?','Quelles pharmacies proposent un pharmacien parlant anglais ?','Quels renseignements demander pour trouver un médicament équivalent localement ?'],
 taxi:['Où se trouve le point de prise en charge taxi ou VTC le plus proche ?','Quelles applications de transport sont fiables dans cette ville ?','Quel tarif habituel pour rejoindre le centre-ville ou le prochain terminal ?','Comment éviter les fausses courses, les suppléments et les arnaques ?']
};
const DRIVER_LANGS={auto:'Automatique',en:'English',th:'ไทย · Thaï',fil:'Filipino · Tagalog',id:'Bahasa Indonesia',es:'Español',fr:'Français'};
const DRIVER_PHRASES={en:'Please take me to',th:'กรุณาพาไปที่',fil:'Pakihatid po ako sa',id:'Tolong antar saya ke',es:'Por favor, lléveme a',fr:'Veuillez me conduire à'};
const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const byId=id=>document.getElementById(id);const uid=()=>crypto?.randomUUID?.()||String(Date.now())+Math.random();
const validPoint=(lat,lon)=>lat!==null&&lat!==undefined&&lat!==''&&lon!==null&&lon!==undefined&&lon!==''&&Number.isFinite(Number(lat))&&Number.isFinite(Number(lon))&&Math.abs(Number(lat))<=90&&Math.abs(Number(lon))<=180;
const state={tab:'voyage',trips:[],activeId:null,worker:'',driverLang:'auto',big:false,busy:false,gps:null,gpsBusy:false,gpsError:'',nearPlace:'',selectedNear:'',questionIndex:0,questionText:'',questionFree:'',questionSelected:0,error:'',notice:'', paidAllowed:false,country:'PH',form:{origin:'',destination:'',via:'',dateTime:'',preference:'surface'}};
try{const old=JSON.parse(localStorage.getItem(STORE)||'{}');if(Array.isArray(old.trips))state.trips=old.trips.filter(t=>t&&typeof t==='object').slice(0,60);if(typeof old.activeId==='string')state.activeId=old.activeId;if(typeof old.worker==='string')state.worker=old.worker;if(DRIVER_LANGS[old.driverLang])state.driverLang=old.driverLang;}catch(_){}
try{const p=JSON.parse(localStorage.getItem(PREF)||'{}');if(COUNTRY[p.country])state.country=p.country;if(p.form&&typeof p.form==='object')for(const k of Object.keys(state.form))if(typeof p.form[k]==='string')state.form[k]=p.form[k].slice(0,400);state.nearPlace=typeof p.nearPlace==='string'?p.nearPlace.slice(0,120):'';state.paidAllowed=p.paidAllowed===true;}catch(_){}
const active=()=>state.trips.find(t=>t.id===state.activeId)||null;
function save(){try{localStorage.setItem(STORE,JSON.stringify({trips:state.trips,activeId:state.activeId,worker:state.worker,driverLang:state.driverLang}));localStorage.setItem(PREF,JSON.stringify({form:state.form,country:state.country,nearPlace:state.nearPlace,paidAllowed:state.paidAllowed}));return true;}catch(_){toast('Stockage indisponible. Exporte tes voyages depuis Réglages.');return false;}}
function toast(s){const t=byId('toast');t.textContent=s;t.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.style.display='none',5000);}
function message(s,type='status'){state.notice=s;state.error=type==='error'?s:'';render();}
function setTab(tab){if(!['voyage','etapes','archives','proche','aide','reglages','chauffeur','question'].includes(tab))return;state.tab=tab;render();window.scrollTo(0,0);}
function field(id,label,value,placeholder='',type='text'){return `<label for="${id}">${esc(label)}</label><input class="field" id="${id}" name="${id}" type="${type}" value="${esc(value)}" placeholder="${esc(placeholder)}" autocomplete="off">${['origin','destination','via'].includes(id)?`<div class="suggestions" style="display:none" id="suggest-${id}" aria-live="polite"></div>`:''}`;}
function header(eyebrow,title,sub=''){return `<div class="eyebrow">${esc(eyebrow)}</div><h1>${esc(title)}</h1>${sub?`<p class="subtitle">${esc(sub)}</p>`:''}`;}
function chooser(){return state.trips.length?`<label for="tripChooser">Voyage sélectionné</label><select class="field" id="tripChooser">${state.trips.map(t=>`<option value="${esc(t.id)}" ${t.id===state.activeId?'selected':''}>${esc(t.name||t.origin+' → '+t.destination)}</option>`).join('')}</select>`:'';}
function countries(){return `<label for="country">🌐 Pays dans lequel tu voyages</label><select id="country" class="field">${Object.entries(COUNTRY).map(([k,v])=>`<option value="${k}" ${k===state.country?'selected':''}>${v.label}</option>`).join('')}</select>`;}
function normalizeSegment(s,i){return {index:i+1,from:String(s?.from||''),to:String(s?.to||''),mode:String(s?.mode||'other'),modeLabel:String(s?.modeLabel||MODES[s?.mode]||'Transport'),fromPlaceName:String(s?.fromPlaceName||''),toPlaceName:String(s?.toPlaceName||''),toAddress:String(s?.toAddress||''),toCity:String(s?.toCity||''),toCountry:String(s?.toCountry||''),fromLatitude:validPoint(s?.fromLatitude,s?.fromLongitude)?Number(s.fromLatitude):null,fromLongitude:validPoint(s?.fromLatitude,s?.fromLongitude)?Number(s.fromLongitude):null,toLatitude:validPoint(s?.toLatitude,s?.toLongitude)?Number(s.toLatitude):null,toLongitude:validPoint(s?.toLatitude,s?.toLongitude)?Number(s.toLongitude):null,service:String(s?.service||s?.serviceDescription||''),notes:String(s?.notes||''),facts:Array.isArray(s?.facts)?s.facts.slice(0,10).map(f=>typeof f==='object'?{text:String(f.text||''),sourceURL:String(f.sourceURL||'')}: {text:String(f)}):[],questions:Array.isArray(s?.questions)?s.questions.slice(0,5).map(String):[]};}
function newTrip(d){return {id:uid(),created:new Date().toISOString(),name:d.name||'',origin:d.origin,destination:d.destination,via:d.via||'',dateTime:d.dateTime||'',preference:d.preference||'surface',summary:d.summary||'',price:d.price||'',duration:d.duration||'',warnings:d.warnings||[],segments:d.segments||[],currentIndex:0,complete:false};}
function buildVoyage(){const t=active(),f=state.form;return header('Préparer · V1.4','Où veux-tu aller ?','Tes adresses restent enregistrées même après une recherche.')+`<section class="card">${field('origin','📍 Départ exact',f.origin,'Hôtel, port, aéroport, ville…')}${field('destination','🏁 Arrivée exacte',f.destination,'Ex. Siquijor ou Chiang Mai')}${field('via','↪ Passage obligatoire (facultatif)',f.via,'Ex. Cebu, Bangkok')}<div class="grid2"><div>${field('dateTime','📅 Date locale',f.dateTime,'','datetime-local')}</div><div><label for="preference">Mode</label><select class="field" id="preference"><option value="surface" ${f.preference==='surface'?'selected':''}>Sans avion</option><option value="air" ${f.preference==='air'?'selected':''}>Avec avion</option></select></div></div><p class="smallprint">💡 Suggestions de lieux gratuites quand tu écris au moins 4 caractères. Vérifie toujours la bonne adresse.</p><div class="actions"><button class="btn secondary" id="createJourney">➕ Créer manuellement</button><button class="btn teal" id="searchJourney" ${state.busy?'disabled':''}>${state.busy?'⏳ Recherche…':'🔎 Recherche intelligente'}</button></div>${state.busy?`<div class="status" role="status">⏳ Recherche en cours. Laisse cet écran ouvert. Cela peut prendre jusqu'à quelques minutes.</div>`:''}${state.notice?`<div class="${state.error?'callout error':'status'}" role="status">${esc(state.notice)}</div>`:''}<div class="callout warning">La recherche intelligente utilise l’ancien moteur API et peut consommer tes crédits. Les autres fonctions sont gratuites. Active-la dans Réglages seulement si tu le souhaites.</div></section>${t?`<section class="card">${chooser()}<h2 style="margin-top:12px">${esc(t.origin)} → ${esc(t.destination)}</h2><p class="subtitle">${t.segments?.length||0} segments · ${esc(t.duration||'Durée à vérifier')} · ${esc(t.price||'Prix à vérifier')}</p><button class="btn wide" data-tab="etapes">Voir cet itinéraire →</button></section>`:''}<p class="smallprint">Vérifie les horaires et tarifs des transporteurs : aucun trajet aérien ou maritime n'est confirmé automatiquement à la réservation.</p>`;}
function buildEtapes(){const t=active();if(!t)return header('Navigation','Mes étapes')+`<section class="card"><p>Aucun voyage sélectionné.</p><button class="btn" data-tab="voyage">Préparer mon voyage</button></section>`;const ss=Array.isArray(t.segments)?t.segments:[],idx=Math.min(Math.max(0,t.currentIndex||0),Math.max(0,ss.length-1));return header('Navigation','Étape par étape',`${t.origin} → ${t.destination}`)+chooser()+`<section class="card"><h2>${esc(t.name||t.origin+' → '+t.destination)}</h2>${t.summary?`<p>${esc(t.summary)}</p>`:''}<div class="row"><span class="pill">${ss.length} segments</span><span class="meta">${esc(t.duration||'Durée à confirmer')}</span></div>${t.price?`<p class="meta">Coût estimé : ${esc(t.price)}</p>`:''}${Array.isArray(t.warnings)&&t.warnings.length?`<div class="callout warning">${t.warnings.map(esc).join('<div class="divider"></div>')}</div>`:''}${ss.length?ss.map((s,i)=>`<article class="step ${idx===i?'active':''}"><div class="row"><span class="pill">${i+1} / ${ss.length}</span><span class="meta">${esc(MODES[s.mode]||s.modeLabel||'Transport')}</span></div><div class="step-title">${esc(s.from)} → ${esc(s.to)}</div>${s.service?`<p class="meta">${esc(s.service)}</p>`:''}${s.notes?`<p class="meta">${esc(s.notes)}</p>`:''}${Array.isArray(s.facts)&&s.facts.length?`<ul class="facts">${s.facts.map(x=>`<li>${esc(x.text||x)}</li>`).join('')}</ul>`:''}<div class="actions"><button class="btn small ${idx===i?'teal':'ghost'}" data-choose="${i}">${idx===i?'✓ Active':'Choisir'}</button><button class="btn small secondary" data-map="${i}">🧭 GPS</button><button class="btn small secondary" data-driver="${i}">🚕 Chauffeur</button><button class="btn small ghost" data-question="${i}">💬 Questions</button></div>${['ferry','boat','plane'].includes(s.mode)?`<p class="smallprint">Pour un ${s.mode==='plane'?'vol':'bateau'}, le GPS ouvre le lieu d'arrivée sans inventer de route terrestre.</p>`:''}</article>`).join(''):`<div class="callout">Aucune étape pour le moment. Ajoute chaque véhicule ou correspondance séparément.</div>`}${ss.length?`<div class="actions"><button class="btn ghost" id="prevSegment" ${idx===0?'disabled':''}>← Précédente</button><button class="btn teal" id="nextSegment">${idx===ss.length-1?'✓ Terminé':'Suivante →'}</button></div>`:''}</section><section class="card"><h2>➕ Ajouter une étape</h2><p class="subtitle">Un véhicule = une étape. Un changement de ferry, taxi ou bus = nouvelle étape.</p>${field('segFrom','Départ',ss.length?ss.at(-1).to:t.origin,'Lieu précis')}${field('segTo','Arrivée','','Terminal, port, hôtel…')}<label for="segMode">Transport</label><select class="field" id="segMode">${Object.entries(MODES).map(([v,s])=>`<option value="${v}" ${v==='taxi'?'selected':''}>${s}</option>`).join('')}</select>${field('segService','Ligne ou service (facultatif)','','Ex. ferry, Grab, numéro du vol')}<label for="segNotes">Notes pratiques</label><textarea class="field" id="segNotes" placeholder="Prix, horaires, repères…"></textarea><button class="btn teal wide" style="margin-top:10px" id="addSegment">Enregistrer cette étape</button></section><div class="actions"><button class="btn secondary" id="export">⬇️ Exporter mes voyages</button><button class="btn ghost" data-tab="archives">📂 Archives</button></div>`;}
function buildArchives(){const trips=state.trips;return header('Stockage local','Mes archives','Prépare tes voyages à l’avance et retrouve-les sur ce téléphone.')+`<section class="card"><div class="row"><h2 style="margin:0">Voyages sauvegardés</h2><span class="pill">${trips.length}</span></div>${!trips.length?`<p class="subtitle" style="margin-top:13px">Aucun voyage pour le moment.</p>`:trips.map(t=>`<div class="step"><div class="archive-title">${esc(t.name||t.origin+' → '+t.destination)}</div><p class="meta">${esc(t.origin)} → ${esc(t.destination)} · ${t.segments?.length||0} segments${t.dateTime?' · '+esc(t.dateTime.replace('T',' ')):''}</p><div class="actions"><button class="btn small teal" data-load="${esc(t.id)}">Ouvrir</button><button class="btn small ghost" data-rename="${esc(t.id)}">Renommer</button><button class="btn small secondary" data-clone="${esc(t.id)}">Dupliquer</button></div></div>`).join('')}</section><section class="card"><h2>📦 Sauvegarde et transfert</h2><p class="subtitle">Les archives restent sur ton appareil. Pour changer d'iPhone, exporte le fichier JSON, puis importe-le sur le nouvel appareil.</p><div class="actions"><button class="btn secondary" id="export">⬇️ Exporter</button><button class="btn ghost" id="importButton">⬆️ Importer</button></div><input type="file" id="importFile" accept=".json,application/json" hidden></section>`;}
function geoLabel(){return state.gps?`Position GPS : ${state.gps.lat.toFixed(5)}, ${state.gps.lon.toFixed(5)} (précision environ ${Math.round(state.gps.accuracy)} m)`:'Position GPS non demandée';}
function nearLocation(){const g=state.gps;if(!g||!validPoint(g.lat,g.lon)||!Number.isFinite(g.accuracy)||g.accuracy>1500||Date.now()-(g.when||0)>5*60*1000)return null;const label=g.lat.toFixed(5)+', '+g.lon.toFixed(5);return {lat:g.lat,lon:g.lon,label,text:label,gps:true};}
async function reverseGpsPosition(lat,lon){const ac=new AbortController(),timer=setTimeout(()=>ac.abort(),8500);try{const url='https://nominatim.openstreetmap.org/reverse?format=jsonv2&addressdetails=1&zoom=14&accept-language=fr&lat='+encodeURIComponent(lat)+'&lon='+encodeURIComponent(lon);const response=await fetch(url,{headers:{Accept:'application/json'},signal:ac.signal});if(!response.ok)throw Error('Géocodage indisponible');const data=await response.json();const a=data?.address||{};const area=a.suburb||a.neighbourhood||a.city_district||a.borough||'';const city=a.city||a.town||a.municipality||a.village||a.county||'';const country=a.country||'';const parts=[area,city,country].filter(Boolean).filter((v,i,all)=>all.findIndex(w=>w.toLowerCase()===v.toLowerCase())===i);if(!city||!country)throw Error('Ville non déterminée');return parts.join(', ');}finally{clearTimeout(timer);}}

function buildProche(){return header('Gratuit · GPS','Proche de moi','Choisis simplement ce que tu cherches. Ta position est récupérée automatiquement.')+`<section class="card"><h2>Que recherches-tu ?</h2><div class="near-grid">${NEAR.map(([k,e,label])=>`<button type="button" class="placebtn ${state.selectedNear===k?'selected':''}" data-near="${k}" aria-pressed="${state.selectedNear===k?'true':'false'}" ${state.gpsBusy?'disabled':''}><span class="emoji">${e}</span>${esc(label)}</button>`).join('')}</div></section>${state.selectedNear?buildNearResult():''}`;}
function buildNearResult(){const item=NEAR.find(n=>n[0]===state.selectedNear);if(!item)return '';const place=nearLocation();return `<section class="card" id="nearResult" aria-live="polite"><h2>${item[1]} ${esc(item[2])}</h2>${state.gpsBusy?'<p class="callout" role="status">📍 Localisation en cours, ouverture de la carte…</p>':state.gpsError?`<div class="callout error" role="alert">${esc(state.gpsError)}</div><button class="btn teal wide" id="retryNear">Réessayer la recherche</button>`:place?'<p class="smallprint">📍 Recherche autour de ta position actuelle.</p>':'<p class="smallprint">Choisis ce thème pour ouvrir les résultats proches de toi.</p>'}${place&&!state.gpsBusy?`<div class="actions"><button class="btn teal" id="openNearMap">🗺️ Revoir les résultats sur Google Maps</button><button class="btn secondary" id="openNearApple">Plans iPhone</button></div>`:''}<h3 style="margin-top:15px">💬 Questions utiles pour ChatGPT</h3>${(NEAR_QUESTIONS[item[0]]||[]).slice(0,4).map((q,i)=>`<button type="button" class="btn ghost questionbtn" data-near-suggest="${i}" ${place&&!state.gpsBusy?'':'disabled'}>💬 ${esc(q)}</button>`).join('')}<button class="btn secondary wide" id="nearQuestion" ${place&&!state.gpsBusy?'':'disabled'}>✍️ Ma question libre</button></section>`;}
function buildAide(){const c=COUNTRY[state.country];return header('Urgences et assistance','🆘 Aide-moi','Cette fiche reste disponible depuis l’écran d’accueil, même sans créer de voyage.')+`<section class="card help-red"><h2>En cas d'urgence</h2><p class="subtitle">Appelle les secours locaux. Ne dépends pas de ChatGPT en cas d'urgence réelle.</p>${countries()}<div class="actions"><button class="btn secondary" id="getGPS">📍 Afficher ma position</button><button class="btn ghost" id="shareGPS">📋 Copier position</button></div><p class="smallprint" id="gpsState" style="color:white">${esc(geoLabel())}</p><div class="actions"><button class="btn secondary" id="showGPSmap">🗺️ Voir ma position sur la carte</button></div></section><section class="card"><h2>📞 Numéros d'urgence · ${esc(c.label)}</h2>${c.emergencies.length?c.emergencies.map(([s,n])=>`<div class="step"><div class="row"><div><div class="smallprint">${esc(s)}</div><div class="help-number">${esc(n)}</div></div><a class="btn danger" href="tel:${encodeURIComponent(n)}">📞 Appeler</a></div></div>`).join(''):`<div class="callout warning">Numéros non renseignés pour ce pays. Vérifie-les auprès des autorités locales avant le départ.</div>`}<p class="smallprint">Les numéros peuvent changer et certains appels exigent un réseau mobile. Vérifie les consignes locales à l'arrivée. Le GPS dépend de l'autorisation et du signal.</p></section>`;}
function currentSegment(){const t=active();if(!t||!t.segments?.length)return null;return t.segments[Math.max(0,Math.min(t.currentIndex||0,t.segments.length-1))];}
function destName(s){return s.toPlaceName?.length>=4?s.toPlaceName:s.to;}
function address(s){return [s.toAddress,s.toCity,s.toCountry].filter(Boolean).join(', ');}
function langFor(t,s){if(state.driverLang!=='auto')return state.driverLang;const raw=[s.toCountry,s.toCity,s.to,t?.destination].join(' ').toLowerCase();if(/thailand|thailande|thaïlande|bangkok|phuket|chiang mai|krabi/.test(raw))return'th';if(/philipp|manila|siquijor|cebu|bohol|makati|taguig|dumaguete/.test(raw))return'fil';if(/indones|indonés|jakarta|bali|bandung/.test(raw))return'id';if(/spain|espagne|dénia|denia|madrid|barcelon/.test(raw))return'es';if(/france|paris|lyon/.test(raw))return'fr';return'en';}
function buildChauffeur(){const s=currentSegment(),t=active();if(!s)return header('Écran chauffeur','Aucun segment')+`<button class="btn" data-tab="etapes">Retour aux étapes</button>`;const lang=langFor(t,s),dest=destName(s);return header('Étape '+((t.currentIndex||0)+1)+' / '+t.segments.length,'🚕 Montrer au chauffeur','Uniquement la destination du segment actif, jamais celle de tout le voyage.')+`<section class="card"><div class="driver-caption">${esc(DRIVER_PHRASES[lang]||DRIVER_PHRASES.en)}</div><div class="driver-place">${esc(dest)}</div>${lang!=='en'?`<div class="driver-caption">Please take me to</div><div class="driver-translation">${esc(dest)}</div>`:''}${address(s)?`<div class="driver-address">${esc(address(s))}</div>`:''}<label for="driverLang">Langue du chauffeur</label><select id="driverLang" class="field">${Object.entries(DRIVER_LANGS).map(([l,n])=>`<option value="${l}" ${l===state.driverLang?'selected':''}>${esc(n)}</option>`).join('')}</select><div class="actions"><button class="btn secondary" id="copyDriver">📋 Copier</button><button class="btn teal" id="mapCurrent">🧭 GPS / Maps</button></div></section><div class="actions"><button class="btn ghost" id="prevSegment">← Précédente</button><button class="btn" id="nextSegment">${t.currentIndex===t.segments.length-1?'✓ Terminée':'Étape suivante →'}</button><button class="btn secondary" data-tab="etapes">Toutes les étapes</button></div>`;}
function suggestedQuestions(s){
 const common=['Où est le point exact de prise en charge, avec adresse et accès depuis ma position ?','Quels sont les horaires et tarifs vérifiables pour cette date ?','Quel temps de correspondance ou marge de sécurité prévoir ?','Quelles alternatives fiables existent en cas de retard ou d’annulation ?'];
 let specific;
 if(s.mode==='plane')specific=['Quel est le terminal de départ, l’enregistrement et la porte à vérifier ?','Combien de temps avant le décollage faut-il arriver et quels bagages sont autorisés ?','Comment vérifier le statut du vol et rejoindre le terminal suivant ?','Que faire en cas de retard ou de correspondance manquée ?'];
 else if(['ferry','boat'].includes(s.mode))specific=['Où est précisément l’embarcadère et le quai d’embarquement ?','Quels sont les horaires officiels et le prix du billet pour la date prévue ?','Où réserver ou acheter le billet et combien de temps avant l’embarquement ?','Comment connaître les annulations dues à la météo et les alternatives ?'];
 else if(['taxi','grab','tricycle','tuktuk','motorbike'].includes(s.mode))specific=['Où prendre un véhicule fiable au point de départ exact ?','Quel tarif ou prix de course raisonnable pour ce trajet ?','Quelle adresse précise dois-je montrer au chauffeur ?','Quelles précautions et solutions de repli pour ce trajet ?'];
 else if(['walk','bicycle'].includes(s.mode))specific=['Quel chemin piéton ou cyclable fiable choisir pour cette étape ?','Combien de temps prévoir avec bagages et où faut-il être vigilant ?','Y a-t-il un itinéraire plus sûr ou plus simple, surtout le soir ?','Quels repères vérifier pour arriver à la bonne entrée ?'];
 else if(['bus','coach','train','metro','tram','jeepney','minibus','van'].includes(s.mode))specific=['Où se trouve exactement l’arrêt ou la gare pour ce départ ?','Quels horaires, tarifs et arrêts intermédiaires sont prévus ?','Où et comment acheter le ticket, et quel véhicule dois-je prendre ?','Que faire si je manque cette correspondance ?'];
 else specific=common;
 // Conserver les questions propres au trajet transmises par le moteur quand elles existent.
 return [...new Set([...(Array.isArray(s.questions)?s.questions.filter(q=>typeof q==='string'&&q.trim()).slice(0,3):[]),...specific,...common])].slice(0,6);
}
function questionPrompt(s,q){
 const t=active();return `Je prépare un voyage avec LudoPilot. Voyage total : ${t.origin} → ${t.destination}. Segment en cours : ${s.from} → ${s.to}. Mode : ${MODES[s.mode]||s.modeLabel}. Date prévue : ${t.dateTime||'à confirmer'}. ${s.service?'Transport : '+s.service+'. ':''}${s.facts?.length?'Informations du trajet : '+s.facts.map(f=>f.text).filter(Boolean).slice(0,4).join(' ; ')+'. ':''}Ma question : ${q}\nRéponds en français, concrètement et brièvement. Cherche des sources récentes quand c’est utile ; sépare les horaires/prix confirmés des estimations. N’invente ni transport ni réservation.`;
}
function nearbyPrompt(q){
 const item=NEAR.find(n=>n[0]===state.selectedNear),loc=nearLocation();
 if(!loc)return 'Position GPS indisponible ou périmée : retourne à « Proche » et choisis le thème pour relocaliser l’iPhone.';
 return `Je consulte « Proche de moi » dans LudoPilot pour : ${item?item[2]:'services proches'}. Ma position GPS actuelle fournie par l’iPhone est ${loc.lat.toFixed(6)}, ${loc.lon.toFixed(6)} (précision environ ${Math.round(state.gps.accuracy)} m). Cherche EXCLUSIVEMENT dans un rayon de proximité autour de ces coordonnées, en donnant priorité aux endroits accessibles à pied. Ne te base ni sur mon adresse IP, ni sur Paris, ni sur une ville supposée.\nMa question : ${q}\nDonne quelques propositions réelles, les distances seulement si vérifiables, les liens de carte et les horaires/tarifs récents quand disponibles ; distingue clairement ce qui n'est pas vérifié. Ne crée pas de faux établissements.`;
}
function buildQuestion(){
 const s=currentSegment(),nearMode=state.questionIndex<0;
 if(!s&&!nearMode)return header('ChatGPT','Aucun segment')+`<button class="btn" data-tab="etapes">Retour</button>`;
 const item=NEAR.find(n=>n[0]===state.selectedNear);
 const qs=nearMode?(NEAR_QUESTIONS[state.selectedNear]||[]):suggestedQuestions(s);
 const title=nearMode?`📍 ${item?item[2]:'Autour de moi'}`:`${s.from} → ${s.to}`;
 return header('Sans crédit API','💬 Questions prêtes pour ChatGPT',title)+`<section class="card"><h2>Choisis une question</h2><p class="smallprint">Une question adaptée au ${nearMode?'thème sélectionné':'transport de cette étape'} suffit. Elle est préparée avec ${nearMode?'tes coordonnées GPS':'les détails du segment'}.</p>${qs.map((q,i)=>`<button type="button" class="btn ghost questionbtn ${state.questionSelected===i?'selected':''}" data-suggest="${i}" aria-pressed="${state.questionSelected===i?'true':'false'}">${state.questionSelected===i?'✓':'💬'} ${esc(q)}</button>`).join('')}<div class="divider"></div><label for="freeQuestion">✍️ Ou écris ta propre question</label><textarea class="field" id="freeQuestion" rows="2" placeholder="Ex. Je cherche l'option la moins chère sans changer trois fois de transport…">${esc(state.questionFree)}</textarea><button class="btn secondary wide" id="prepareFreeQuestion" style="margin-top:8px">Préparer ma question libre</button><div class="divider"></div><label for="questionText">Texte préparé à copier (modifiable)</label><textarea class="field" id="questionText" rows="7">${esc(state.questionText)}</textarea><div class="actions"><button class="btn teal" id="copyQuestion">📋 Copier pour ChatGPT</button><a class="btn secondary" href="https://chatgpt.com/" target="_blank" rel="noopener noreferrer">Ouvrir ChatGPT ↗</a></div><p class="question-tip">① Choisis une question ② Copie ③ Colle dans ton ChatGPT. Aucun crédit API LudoPilot n’est utilisé.</p></section><button class="btn ghost" data-tab="${nearMode?'proche':'etapes'}">← Retour</button>`;
}
function buildReglages(){return header('Paramètres','⚙️ Réglages','Les fonctions gratuites sont disponibles sans clé ni abonnement supplémentaire.')+`<section class="card"><h2>💸 Maîtriser les coûts API</h2><div class="callout">Google Maps, Archives, GPS et questions via ton ChatGPT personnel ne consomment pas de crédits API LudoPilot.</div><label class="line-check"><input type="checkbox" id="paidAllowed" ${state.paidAllowed?'checked':''}><span><strong>Autoriser les recherches intelligentes payantes</strong><br><span class="smallprint">Désactivé par défaut. Une confirmation sera également demandée avant chaque recherche.</span></span></label>${field('worker','Adresse du moteur Cloudflare (facultatif)',state.worker,'https://…workers.dev','url')}<p class="smallprint">Ne saisis jamais de clé secrète OpenAI ou Google dans ce site public. Un Worker partagé publiquement devrait être protégé côté serveur contre les appels non autorisés.</p><button class="btn secondary" id="saveWorker">Enregistrer cette adresse</button></section><section class="card"><h2>📂 Archives</h2><div class="actions"><button class="btn secondary" id="export">Exporter JSON</button><button class="btn ghost" id="importButton">Importer JSON</button></div><input id="importFile" type="file" accept=".json,application/json" hidden><p class="smallprint">Les sauvegardes restent sur cet appareil. Tu peux les exporter vers Fichiers ou iCloud.</p></section><section class="card"><h2>📴 Mode hors connexion</h2><p class="smallprint">Les voyages et les fiches d’urgence enregistrés sont consultables hors ligne après chargement de l'application. Les cartes en ligne, les suggestions de lieux, les recherches et ChatGPT nécessitent Internet. Vérifie toujours les horaires des ferries, bus et vols.</p></section><p class="smallprint">LudoPilot Voyages V1.4 · Site GitHub Pages · Données personnelles stockées localement.</p>`;}
function render(){const app=byId('app');app.innerHTML=({voyage:buildVoyage,etapes:buildEtapes,archives:buildArchives,proche:buildProche,aide:buildAide,chauffeur:buildChauffeur,question:buildQuestion,reglages:buildReglages}[state.tab]||buildVoyage)();document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.tab));}
function createJourney(){const d={...state.form,origin:state.form.origin.trim(),destination:state.form.destination.trim()};if(!d.origin||!d.destination){toast('Indique le départ et l’arrivée.');return;}const t=newTrip(d);state.trips.unshift(t);state.activeId=t.id;save();setTab('etapes');toast('Voyage enregistré. Ajoute ses étapes.');}
function addSegment(){const t=active();if(!t)return;const from=byId('segFrom')?.value.trim(),to=byId('segTo')?.value.trim();if(!from||!to){toast('Indique les deux lieux de l’étape.');return;}if(from.toLowerCase()===to.toLowerCase()){toast('Départ et arrivée identiques.');return;}if(t.segments.length>=16){toast('Maximum 16 segments.');return;}const prev=t.segments.at(-1);if(prev&&prev.to.trim().toLowerCase()!==from.toLowerCase()&&!confirm('Correspondance non raccordée avec l’étape précédente. Continuer ?'))return;t.segments.push(normalizeSegment({from,to,mode:byId('segMode').value,service:byId('segService').value.trim(),notes:byId('segNotes').value.trim()},t.segments.length));save();render();toast('Étape enregistrée.');}
function advance(delta){const t=active();if(!t||!t.segments?.length)return;const idx=t.currentIndex||0;if(delta>0&&idx>=t.segments.length-1){t.complete=true;save();toast('Dernière étape terminée.');return;}t.currentIndex=Math.max(0,Math.min(t.segments.length-1,idx+delta));t.complete=false;save();render();}
function mapUrl(s){const marine=['plane','ferry','boat'].includes(s.mode);const dest=validPoint(s.toLatitude,s.toLongitude)?`${s.toLatitude},${s.toLongitude}`:[s.to,address(s)].filter(Boolean).join(', ');if(marine)return'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(dest);let travelmode='driving';if(s.mode==='walk')travelmode='walking';if(s.mode==='bicycle')travelmode='bicycling';if(['train','metro','tram','bus','coach','jeepney','minibus','van'].includes(s.mode))travelmode='transit';const from=state.gps?`${state.gps.lat},${state.gps.lon}`:validPoint(s.fromLatitude,s.fromLongitude)?`${s.fromLatitude},${s.fromLongitude}`:s.from;return 'https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(from)+'&destination='+encodeURIComponent(dest)+'&travelmode='+travelmode;}
function openURL(url){window.open(url,'_blank','noopener,noreferrer');}
function nearUrl(){const place=nearLocation(),item=NEAR.find(n=>n[0]===state.selectedNear);if(!place||!item)return null;const lat=place.lat.toFixed(6),lon=place.lon.toFixed(6);return 'https://www.google.com/maps/search/'+encodeURIComponent(item[3])+'/@'+lat+','+lon+',15z';}
function nearAppleUrl(){const place=nearLocation(),item=NEAR.find(n=>n[0]===state.selectedNear);if(!place||!item)return null;return 'https://maps.apple.com/?q='+encodeURIComponent(item[3])+'&sll='+place.lat.toFixed(6)+','+place.lon.toFixed(6)+'&z=15';}
let nearRequestSerial=0;
function searchNearCategory(category){
 const item=NEAR.find(n=>n[0]===category);if(!item||state.gpsBusy)return;
 const serial=++nearRequestSerial;state.selectedNear=category;state.gps=null;state.gpsError='';
 if(!navigator.geolocation){state.gpsError='La localisation GPS est indisponible sur cet appareil.';render();return;}
 state.gpsBusy=true;render();
 navigator.geolocation.getCurrentPosition(pos=>{
  if(serial!==nearRequestSerial)return;
  state.gpsBusy=false;
  const lat=pos.coords.latitude,lon=pos.coords.longitude,accuracy=pos.coords.accuracy;
  if(!validPoint(lat,lon)||!Number.isFinite(accuracy)||accuracy>1500){
   state.gps=null;state.gpsError='Position GPS trop imprécise. Réessaie près d’une fenêtre ou à l’extérieur.';render();return;
  }
  state.gps={lat,lon,accuracy,when:Date.now()};state.gpsError='';render();
  const url=nearUrl();if(url)window.location.assign(url);
 },err=>{
  if(serial!==nearRequestSerial)return;
  state.gpsBusy=false;state.gps=null;
  state.gpsError=err.code===1?'Autorise la localisation de LudoPilot dans les réglages de Safari, puis réessaie.':'Impossible d’obtenir ta position pour le moment. Réessaie.';
  render();
 },{enableHighAccuracy:true,timeout:16000,maximumAge:0});
}
function gps(then){if(!navigator.geolocation){state.gpsError='GPS indisponible sur ce navigateur. Aucune recherche à proximité ne sera lancée.';render();return;}if(state.gpsBusy)return;state.gpsBusy=true;state.gpsError='';render();navigator.geolocation.getCurrentPosition(pos=>{const lat=pos.coords.latitude,lon=pos.coords.longitude,accuracy=pos.coords.accuracy;state.gps={lat,lon,accuracy,when:Date.now(),place:''};state.gpsBusy=false;if(!validPoint(lat,lon))state.gpsError='Coordonnées GPS invalides : nouvelle tentative nécessaire.';else if(!Number.isFinite(accuracy)||accuracy>1500)state.gpsError='Position trop imprécise (environ '+Math.round(accuracy)+' m) pour une recherche à proximité. Réessaie dans un endroit mieux couvert.';else state.gpsError='';render();if(!state.gpsError){toast('📍 GPS prêt : '+lat.toFixed(5)+', '+lon.toFixed(5));if(typeof then==='function')then();}},err=>{state.gpsBusy=false;state.gps=null;state.gpsError=err.code===1?'Accès GPS refusé. Autorise la position de LudoPilot dans les réglages iPhone.':'GPS non disponible. Aucune recherche à proximité ne sera lancée.';render();toast(state.gpsError);},{enableHighAccuracy:true,timeout:16000,maximumAge:0});}

async function copyText(s){try{await navigator.clipboard.writeText(s);toast('Texte copié.');}catch(_){const ta=byId('questionText');if(ta){ta.focus();ta.select();toast('Sélectionne « Copier » puis colle dans ChatGPT.');}else toast('Copie indisponible sur ce navigateur.');}}
function driverText(s){const t=active(),lang=langFor(t,s),name=destName(s);return `${DRIVER_PHRASES[lang]||DRIVER_PHRASES.en} ${name}${address(s)?'\n'+address(s):''}`;}
function setQuestion(i,preset=0){const t=active();state.questionFree='';state.questionSelected=preset;if(i>=0&&t?.segments?.[i]){t.currentIndex=i;save();state.questionIndex=i;const q=suggestedQuestions(t.segments[i])[preset]||suggestedQuestions(t.segments[i])[0];state.questionText=questionPrompt(t.segments[i],q);}else{state.questionIndex=-1;const q=(NEAR_QUESTIONS[state.selectedNear]||[])[preset]||'Quels établissements fiables se trouvent réellement près de moi ?';state.questionText=nearbyPrompt(q);}setTab('question');}
function updateFormFromDom(){for(const k of Object.keys(state.form)){const el=byId(k);if(el)state.form[k]=el.value;}save();}
async function searchJourney(){updateFormFromDom();const d={...state.form};if(!d.origin.trim()||!d.destination.trim()){toast('Indique le départ et l’arrivée.');return;}if(!state.worker){message('Adresse du moteur absente. Tu peux créer le voyage manuellement, sans frais.','error');return;}if(!state.paidAllowed){message('Recherche intelligente désactivée pour protéger tes crédits. Tu peux l’autoriser dans Réglages.','error');return;}if(!confirm('Cette recherche utilise l’API du moteur LudoPilot et peut consommer tes crédits. Lancer cette recherche ?'))return;if(state.busy)return;state.busy=true;state.notice='Recherche en cours. Patiente sans quitter la page.';state.error='';render();let timeout;try{const ac=new AbortController();timeout=setTimeout(()=>ac.abort(),165000);const url=state.worker.replace(/\/+$/,'')+'/travel-info';const resp=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},signal:ac.signal,body:JSON.stringify({origin:d.origin,destination:d.destination,via:d.via,localDateTime:d.dateTime||new Date().toISOString(),dateTime:d.dateTime||new Date().toISOString(),routePreference:d.preference,transportModes:{allowFerryBoat:true,allowBusShared:true,allowRail:true,allowTaxiGrab:true,allowLocalMotor:true},travelOptions:{}})});const json=await resp.json();if(!resp.ok||!json.ok||!Array.isArray(json.info?.segments))throw Error(json.error||json.details||`Erreur HTTP ${resp.status}`);const info=json.info,ss=info.segments.slice(0,16).map(normalizeSegment);if(!ss.length)throw Error('Aucun segment fourni.');const t=newTrip({...d,summary:info.summary||'',price:info.ranking?.priceText||'',duration:info.ranking?.durationText||'',warnings:info.warnings||[],segments:ss});state.trips.unshift(t);state.trips=state.trips.slice(0,60);state.activeId=t.id;state.notice='Itinéraire reçu et archivé. Vérifie les horaires.';save();setTab('etapes');toast('Voyage sauvegardé dans Archives.');}catch(e){state.error='Erreur de recherche : '+(e.name==='AbortError'?'délai dépassé':String(e.message||e));state.notice=state.error;toast('Recherche impossible, message conservé à l’écran.');}finally{clearTimeout(timeout);state.busy=false;render();}}
function saveWorker(){const raw=byId('worker')?.value.trim()||'';if(!raw){state.worker='';state.paidAllowed=false;save();toast('Moteur désactivé.');return;}try{const u=new URL(raw);if(u.protocol!=='https:'||u.username||u.password||u.search||u.hash)throw Error('URL HTTPS simple obligatoire');state.worker=u.origin+u.pathname.replace(/\/+$/,'').replace(/\/travel-info$/,'');save();toast('Adresse mémorisée. La connexion réelle sera testée lors d’une recherche.');}catch(e){toast('Adresse invalide : '+e.message);}}
function downloadJson(){const blob=new Blob([JSON.stringify({app:'LudoPilot Voyages',version:11,exported:new Date().toISOString(),trips:state.trips,activeId:state.activeId},null,2)],{type:'application/json'});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='LudoPilot-Mes-voyages.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),15000);toast('Sauvegarde à enregistrer dans Fichiers.');}
async function importFile(file){if(!file)return;try{if(file.size>3e6)throw Error('Fichier trop volumineux');const o=JSON.parse(await file.text());if(!Array.isArray(o.trips))throw Error('Format non reconnu');const tr=o.trips.filter(t=>t&&typeof t.origin==='string'&&typeof t.destination==='string'&&Array.isArray(t.segments)).slice(0,60).map(t=>({...newTrip({...t,segments:t.segments.slice(0,16).map(normalizeSegment)}),id:uid(),currentIndex:Math.max(0,Math.min(Number(t.currentIndex)||0,t.segments.length-1))}));if(!tr.length)throw Error('Aucun voyage valide');if(!confirm('Importer '+tr.length+' voyages sans effacer les archives actuelles ?'))return;state.trips=[...tr,...state.trips].slice(0,60);state.activeId=tr[0].id;save();setTab('archives');toast('Voyages importés.');}catch(e){toast('Import impossible : '+e.message);}}
// Suggestions gratuites Photon/OpenStreetMap. Requêtes espacées et limitées ; le serveur public peut refuser ou ralentir.
let geoTimer=null, geoController=null, geoLast=0;const geoCache=new Map();
function scheduleSuggest(id){const el=byId(id),box=byId('suggest-'+id);if(!el||!box)return;clearTimeout(geoTimer);if(geoController)geoController.abort();const q=el.value.trim();if(q.length<4||!navigator.onLine){box.style.display='none';return;}box.style.display='block';box.innerHTML='<div class="smallprint" style="padding:9px">Recherche de lieux gratuits…</div>';geoTimer=setTimeout(()=>loadSuggest(id,q),900);}
async function loadSuggest(id,q){const box=byId('suggest-'+id),el=byId(id);if(!box||!el||el.value.trim()!==q)return;let features=[];if(geoCache.has(q.toLowerCase()))features=geoCache.get(q.toLowerCase());else{try{geoController=new AbortController();const diff=Date.now()-geoLast;if(diff<1000)await new Promise(r=>setTimeout(r,1000-diff));if(geoController.signal.aborted)return;geoLast=Date.now();const resp=await fetch('https://photon.komoot.io/api/?'+new URLSearchParams({q,limit:'5',lang:'en'}),{signal:geoController.signal});if(!resp.ok)throw Error('service indisponible');const d=await resp.json();features=Array.isArray(d.features)?d.features.slice(0,5):[];geoCache.set(q.toLowerCase(),features);if(geoCache.size>35)geoCache.delete(geoCache.keys().next().value);}catch(e){if(e.name==='AbortError')return;box.innerHTML='<div class="smallprint" style="padding:9px">Suggestions indisponibles. Tu peux saisir l’adresse manuellement.</div>';return;}}
if(!byId('suggest-'+id)||byId(id)?.value.trim()!==q)return;box.innerHTML=features.length?features.map((f,i)=>{const p=f.properties||{},label=[p.name,p.street,p.city||p.county,p.state,p.country].filter(Boolean).filter((v,i,a)=>a.indexOf(v)===i).join(', ');return `<button type="button" data-place="${esc(id)}" data-idx="${i}" title="${esc(label)}">📍 ${esc(p.name||p.city||p.country||'Lieu')}<div class="suggest-meta">${esc([p.street,p.city||p.county,p.state,p.country].filter(Boolean).join(', '))}</div></button>`;}).join(''):'<div class="smallprint" style="padding:9px">Aucun résultat. Saisis l’adresse manuellement.</div>';box.style.display='block';box._features=features;}
byId('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b)setTab(b.dataset.tab);});
byId('helpTop').onclick=()=>setTab('aide');byId('settingsTop').onclick=()=>setTab('reglages');
byId('app').addEventListener('input',e=>{const id=e.target.id;if(Object.hasOwn(state.form,id)){state.form[id]=e.target.value;save();if(['origin','destination','via'].includes(id))scheduleSuggest(id);}if(id==='questionText')state.questionText=e.target.value;if(id==='freeQuestion')state.questionFree=e.target.value;});
byId('app').addEventListener('change',e=>{const id=e.target.id;if(id==='tripChooser'){state.activeId=e.target.value;save();render();}if(id==='country'&&COUNTRY[e.target.value]){state.country=e.target.value;state.nearPlace='';state.gps=null;state.gpsError='';save();render();}if(id==='paidAllowed'){if(e.target.checked){if(!confirm('Autoriser des recherches utilisant potentiellement tes crédits OpenAI ?')){e.target.checked=false;state.paidAllowed=false;}else state.paidAllowed=true;}else state.paidAllowed=false;save();}if(id==='preference'){state.form.preference=e.target.value;save();}if(id==='driverLang'){state.driverLang=e.target.value;save();render();}if(id==='importFile')importFile(e.target.files[0]);});
byId('app').addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab){setTab(b.dataset.tab);return;}if(b.dataset.place){const box=byId('suggest-'+b.dataset.place),f=box?._features?.[Number(b.dataset.idx)];if(!f)return;const p=f.properties||{};const label=[p.name,p.street,p.city||p.county,p.state,p.country].filter(Boolean).filter((v,i,a)=>a.indexOf(v)===i).join(', ');state.form[b.dataset.place]=label;byId(b.dataset.place).value=label;box.style.display='none';save();return;}if(b.dataset.choose!==undefined){const t=active();if(t){t.currentIndex=Number(b.dataset.choose);t.complete=false;save();render();}return;}if(b.dataset.load){state.activeId=b.dataset.load;save();setTab('etapes');return;}if(b.dataset.rename){const t=state.trips.find(x=>x.id===b.dataset.rename);if(t){const n=prompt('Nom du voyage',t.name||t.destination);if(n!==null&&n.trim()){t.name=n.trim().slice(0,80);save();render();}}return;}if(b.dataset.clone){const t=state.trips.find(x=>x.id===b.dataset.clone);if(t){const copy=JSON.parse(JSON.stringify(t));copy.id=uid();copy.name=(t.name||t.destination)+' (copie)';copy.created=new Date().toISOString();state.trips.unshift(copy);state.activeId=copy.id;save();render();toast('Copie ajoutée aux archives.');}return;}if(b.dataset.driver!==undefined){const t=active();if(t){t.currentIndex=Number(b.dataset.driver);save();setTab('chauffeur');}return;}if(b.dataset.map!==undefined){const t=active();if(t?.segments?.[Number(b.dataset.map)])openURL(mapUrl(t.segments[Number(b.dataset.map)]));return;}if(b.dataset.question!==undefined){setQuestion(Number(b.dataset.question));return;}if(b.dataset.near){searchNearCategory(b.dataset.near);return;}if(b.dataset.nearSuggest!==undefined){if(!nearLocation()){state.gpsError='Position GPS non disponible. Choisis à nouveau le thème pour lancer la localisation.';render();return;}setQuestion(-1,Number(b.dataset.nearSuggest));return;}if(b.dataset.suggest!==undefined){const idx=Number(b.dataset.suggest);const near=state.questionIndex<0;const q=near?(NEAR_QUESTIONS[state.selectedNear]||[])[idx]:currentSegment()?suggestedQuestions(currentSegment())[idx]:null;if(q){state.questionSelected=idx;state.questionText=near?nearbyPrompt(q):questionPrompt(currentSegment(),q);render();}return;}
const t=active();switch(b.id){case'createJourney':updateFormFromDom();createJourney();break;case'searchJourney':await searchJourney();break;case'addSegment':addSegment();break;case'prevSegment':advance(-1);break;case'nextSegment':advance(1);break;case'mapCurrent':if(currentSegment())openURL(mapUrl(currentSegment()));break;case'copyDriver':if(currentSegment())await copyText(driverText(currentSegment()));break;case'getGPS':gps();break;case'retryNear':searchNearCategory(state.selectedNear);break;case'shareGPS':if(!state.gps)gps();else await copyText(`Ma position GPS : https://www.google.com/maps/search/?api=1&query=${state.gps.lat},${state.gps.lon}`);break;case'showGPSmap':if(state.gps)openURL('https://www.google.com/maps/search/?api=1&query='+state.gps.lat+','+state.gps.lon);else gps(()=>openURL('https://www.google.com/maps/search/?api=1&query='+state.gps.lat+','+state.gps.lon));break;case'openNearMap':{const u=nearUrl();if(!u){state.gpsError='Position GPS non disponible. Sélectionne à nouveau le thème.';render();break;}openURL(u);break;}case'openNearApple':{const u=nearAppleUrl();if(!u){state.gpsError='Position GPS non disponible. Sélectionne à nouveau le thème.';render();break;}openURL(u);break;}case'nearQuestion':if(nearLocation())setQuestion(-1);else{state.gpsError='Sélectionne à nouveau le thème pour actualiser ta position avant ta question.';render();}break;case'prepareFreeQuestion':{const q=state.questionFree.trim();if(!q){toast('Écris d’abord ta question.');break;}if(state.questionIndex<0){if(!nearLocation()){toast('GPS expiré : choisis à nouveau le thème pour relocaliser l’iPhone.');break;}state.questionText=nearbyPrompt(q);}else if(currentSegment())state.questionText=questionPrompt(currentSegment(),q);state.questionSelected=-1;render();toast('Question libre préparée.');break;}case'copyQuestion':await copyText(state.questionText);break;case'saveWorker':saveWorker();break;case'export':downloadJson();break;case'importButton':byId('importFile')?.click();break;case'deleteTrip':if(t&&confirm('Supprimer définitivement ce voyage local ?')){state.trips=state.trips.filter(x=>x.id!==t.id);state.activeId=state.trips[0]?.id||null;save();setTab('archives');}break;}});
window.addEventListener('online',()=>{if(state.tab==='voyage')render();});
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
render();
})();
</script>

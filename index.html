<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#102b44">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="LudoPilot">
  <meta name="description" content="LudoPilot Voyages : trajets par segments, étapes hors ligne et instructions pour les chauffeurs.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="apple-touch-icon" href="./icon-180.png">
  <title>LudoPilot Voyages</title>
  <style>
    :root {color-scheme: light; --ink:#17364d; --muted:#627588; --bg:#eef4f7; --card:#fff; --blue:#086fab; --line:#dae4ea; --accent:#0d8c86; --warn:#a65b00; --red:#b33939}
    * {box-sizing:border-box} html {scroll-behavior:smooth} body {margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;padding-bottom:calc(91px + env(safe-area-inset-bottom))}
    button,input,select,textarea {font:inherit} button {cursor:pointer} .top {background:#102b44;color:white;padding:calc(14px + env(safe-area-inset-top)) 17px 16px;box-shadow:0 5px 18px #102b4415}
    .top-line {display:flex;justify-content:space-between;align-items:center;gap:10px;max-width:650px;margin:auto}.brand {font-size:21px;font-weight:800;letter-spacing:-.4px}.subbrand {font-size:11px;letter-spacing:1.5px;opacity:.7;font-weight:700}.connection {font-size:12px;padding:5px 10px;border:1px solid #ffffff35;border-radius:100px;white-space:nowrap}
    main {max-width:650px;margin:0 auto;padding:19px 15px 14px}.card {background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:15px;box-shadow:0 5px 20px #16446008}
    h1 {font-size:25px;line-height:1.15;margin:0 0 7px;letter-spacing:-.6px} h2 {font-size:19px;letter-spacing:-.3px;margin:0 0 11px} h3{font-size:16px;margin:0 0 4px} p{margin:0 0 12px}.subtitle {color:var(--muted);font-size:14px}.eyebrow {font-size:11px;text-transform:uppercase;color:var(--accent);letter-spacing:1.4px;font-weight:800;margin-bottom:5px}
    label {display:block;font-size:13px;font-weight:750;margin:12px 0 5px}.field {width:100%;border:1px solid #cbd9e2;background:white;color:#17364d;border-radius:11px;padding:13px 12px;min-height:48px;font-size:16px} textarea.field{min-height:85px;resize:vertical}
    .grid2 {display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn {border:none;padding:13px 14px;min-height:48px;border-radius:12px;background:var(--blue);color:white;font-weight:800;text-align:center;display:inline-flex;align-items:center;justify-content:center;gap:7px}.btn:disabled{opacity:.5}.btn.secondary {background:#e8f2f8;color:#0e668e}.btn.ghost{background:white;border:1px solid #cbd9e2;color:#244c65}.btn.teal{background:var(--accent)}.btn.small{font-size:13px;padding:9px 11px;min-height:39px}.btn.danger{background:#fff2f0;color:#9c2929}.wide {width:100%}.actions{display:flex;gap:9px;flex-wrap:wrap}.actions > .btn {flex:1}.muted {color:var(--muted)}.smallprint{font-size:12px;color:var(--muted);line-height:1.5}.callout {padding:13px;background:#eff8f7;border-left:3px solid var(--accent);border-radius:10px;color:#28505c;font-size:13px;margin:12px 0}.warning{background:#fff5e7;border-color:#ffcf86;color:#814b12}
    .pill{display:inline-flex;align-items:center;padding:4px 9px;background:#e7f4f8;border-radius:50px;font-size:11px;font-weight:800;color:#1f7189}.trip-select{margin:8px 0 15px}.line {height:1px;background:var(--line);margin:15px 0}.step {border:1px solid var(--line);background:white;border-radius:14px;padding:14px;margin-bottom:10px}.step.active{border:2px solid var(--accent);padding:13px;background:#f6fffd}.step-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.step-num{background:#d8eef0;border-radius:100%;height:30px;min-width:30px;display:grid;place-items:center;font-weight:800;font-size:13px}.step-body{padding-left:40px}.meta{font-size:13px;color:var(--muted);margin:7px 0}.step-title{font-size:16px;font-weight:800}.info-list{margin:8px 0 0;padding-left:17px;font-size:13px;color:#526a79}.info-list li{margin:4px 0}.checkbox{display:flex;align-items:flex-start;gap:8px;font-size:13px;margin:10px 0}.checkbox input{margin-top:3px}
    .driver-banner{text-align:center;padding:15px 5px 5px}.driver-caption{letter-spacing:1px;color:var(--accent);text-transform:uppercase;font-size:12px;font-weight:900}.driver-place{font-size:clamp(27px,7vw,39px);line-height:1.17;font-weight:900;overflow-wrap:anywhere;letter-spacing:-1px;margin:18px 0}.driver-translation{font-size:20px;font-weight:650;color:#25546a;margin:16px 0}.driver-address{font-size:15px;color:var(--muted);overflow-wrap:anywhere}.driver-meta{padding:9px 13px;background:#e9f5f4;border-radius:10px;color:#276864;font-weight:800;text-align:center;font-size:13px;margin-bottom:14px}
    nav {position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:8px 5px calc(7px + env(safe-area-inset-bottom));z-index:10;box-shadow:0 -4px 18px #1644600b} nav button {border:none;background:transparent;color:#637586;display:grid;justify-items:center;gap:1px;padding:6px 1px;font-size:11px;font-weight:750;border-radius:11px} nav button.active {color:var(--blue);background:#ecf5fa} nav button span.icon {font-size:23px;line-height:1.3}
    #toast {position:fixed;bottom:calc(92px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);max-width:calc(100vw - 30px);width:max-content;background:#163b50;color:white;border-radius:12px;padding:11px 15px;display:none;z-index:20;box-shadow:0 6px 25px #0003;font-size:13px;text-align:center}
    a{color:var(--blue);word-break:break-word} code {font-size:12px} .bigMode .driver-place{font-size:clamp(38px,10vw,62px)} .bigMode .driver-translation{font-size:28px}
    @media(max-width:375px) {.grid2{grid-template-columns:1fr}.card{padding:15px}.top{padding-left:13px;padding-right:13px}.connection{font-size:11px}}
    @media print {nav,.top,.actions,.btn,.hide-print{display:none!important}body{padding:0;background:white}.card{box-shadow:none;border:0}}
  </style>
</head>
<body>
  <header class="top"><div class="top-line"><div><div class="brand">🧭 LudoPilot <span style="color:#60d8d0">Voyages</span></div><div class="subbrand">TON COMPAGNON DE ROUTE</div></div><span id="connection" class="connection" aria-live="polite">Connexion…</span></div></header>
  <main id="app"></main>
  <nav id="tabs" aria-label="Sections"><button data-tab="voyage"><span class="icon">🧭</span>Voyage</button><button data-tab="etapes"><span class="icon">🗺️</span>Étapes</button><button data-tab="chauffeur"><span class="icon">🚕</span>Chauffeur</button><button data-tab="reglages"><span class="icon">⚙️</span>Réglages</button></nav>
  <div id="toast" role="status" aria-live="polite"></div>
  <script>
  (() => {
    "use strict";
    const STORE = "ludopilot-voyages-v1";
    const MODES = {walk:"🚶 Marche",bicycle:"🚲 Vélo",motorbike:"🛵 Moto-taxi",tricycle:"🛺 Tricycle",tuktuk:"🛺 Tuk-tuk",taxi:"🚕 Taxi",grab:"🚙 Grab",jeepney:"🚌 Jeepney",minibus:"🚐 Minibus",bus:"🚌 Bus",coach:"🚌 Autocar",van:"🚐 Van",train:"🚆 Train",metro:"🚇 Métro",ferry:"⛴️ Ferry",boat:"🚤 Bateau",plane:"✈️ Avion",other:"📍 Autre"};
    const esc = v => String(v == null ? "" : v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
    const key = () => typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : String(Date.now())+Math.random();
    const byId = id => document.getElementById(id);
    let state = { tab:"voyage", trips:[], activeId:null, worker:"", driverLang:"auto", big:false, busy:false };
    try {const stored=JSON.parse(localStorage.getItem(STORE)||"{}");if(Array.isArray(stored.trips))state.trips=stored.trips.slice(0,60);if(typeof stored.activeId==="string")state.activeId=stored.activeId;if(typeof stored.worker==="string")state.worker=stored.worker;if(typeof stored.driverLang==="string"&&["auto","en","th","fil","id","es","fr"].includes(stored.driverLang))state.driverLang=stored.driverLang;}catch(_){}
    function active(){return state.trips.find(t=>t.id===state.activeId)||null;}
    function save(){try{localStorage.setItem(STORE,JSON.stringify({trips:state.trips,activeId:state.activeId,worker:state.worker,driverLang:state.driverLang}));return true;}catch(_){toast("Stockage saturé ou indisponible. Exporte tes voyages.");return false;}}
    function toast(s){const t=byId("toast");t.textContent=s;t.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display="none",3500);}
    function setTab(tab){state.tab=tab;render();window.scrollTo(0,0);}
    function field(id,label,value,attrs=""){return `<label for="${id}">${label}</label><input class="field" id="${id}" value="${esc(value)}" ${attrs}>`;}
    function tripChooser(){if(!state.trips.length)return "";return `<label for="tripChooser">Voyage enregistré</label><select class="field trip-select" id="tripChooser">${state.trips.map(t=>`<option value="${esc(t.id)}" ${t.id===state.activeId?"selected":""}>${esc(t.origin)} → ${esc(t.destination)}</option>`).join("")}</select>`;}
    function modeOptions(selected){return Object.entries(MODES).map(([v,label])=>`<option value="${v}" ${v===selected?"selected":""}>${label}</option>`).join("");}
    function validateTrip(t){return t&&typeof t==="object"&&typeof t.origin==="string"&&typeof t.destination==="string"&&Array.isArray(t.segments);}
    function newTrip(data){return {id:key(),created:new Date().toISOString(),origin:data.origin,destination:data.destination,via:data.via||"",dateTime:data.dateTime||"",preference:data.preference||"surface",summary:data.summary||"",price:data.price||"",duration:data.duration||"",warnings:data.warnings||[],segments:data.segments||[],currentIndex:0,complete:false};}
    function readJourney(){return {origin:byId("origin")?.value.trim()||"",destination:byId("destination")?.value.trim()||"",via:byId("via")?.value.trim()||"",dateTime:byId("dateTime")?.value||"",preference:byId("preference")?.value||"surface"};}
    function createJourney(){const d=readJourney();if(!d.origin||!d.destination){toast("Renseigne le départ et la destination.");return;}const t=newTrip(d);state.trips.unshift(t);state.activeId=t.id;save();setTab("etapes");toast("Voyage créé. Ajoute chaque transport séparément.");}
    function normalizeSegment(s,i){return {index:i+1,from:String(s?.from||""),to:String(s?.to||""),mode:String(s?.mode||"other"),modeLabel:String(s?.modeLabel||MODES[s?.mode]||"Transport"),fromPlaceName:String(s?.fromPlaceName||""),toPlaceName:String(s?.toPlaceName||""),toAddress:String(s?.toAddress||""),toCity:String(s?.toCity||""),toCountry:String(s?.toCountry||""),toLatitude:typeof s?.toLatitude==="number"?s.toLatitude:null,toLongitude:typeof s?.toLongitude==="number"?s.toLongitude:null,service:String(s?.service||""),notes:String(s?.notes||""),facts:Array.isArray(s?.facts)?s.facts.slice(0,10):[]};}
    function buildVoyage(){const t=active();return `<div class="eyebrow">Voyages · Version 1</div><h1>Où veux-tu aller ?</h1><p class="subtitle">Un voyage découpé en vrais segments, du premier départ à la dernière arrivée.</p>
      <section class="card">${tripChooser()}<h2>Préparer un voyage</h2>${field("origin","📍 Départ exact",t?.destination? t.destination : "",'placeholder="Hôtel, aéroport, ville…"')}${field("destination","🏁 Destination","",'placeholder="Ex. Siquijor ou Chiang Mai"')}${field("via","↪ Passage obligatoire (facultatif)","",'placeholder="Ex. Cebu ou Bangkok"')}
      <div class="grid2"><div>${field("dateTime","📅 Date et heure locale","",'type="datetime-local"')}</div><div><label for="preference">🧭 Type de trajet</label><select id="preference" class="field"><option value="surface">Sans avion</option><option value="air">Avec avion</option></select></div></div>
      <div class="actions" style="margin-top:17px"><button class="btn teal" id="searchJourney" ${state.busy?"disabled":""}>${state.busy?"Recherche en cours…":"🔎 Rechercher le trajet"}</button><button class="btn secondary" id="createJourney">✍️ Créer manuellement</button></div>
      ${state.worker?'<p class="smallprint" style="margin-top:10px">Moteur LudoPilot configuré. Les horaires et tarifs restent à vérifier auprès des transporteurs.</p>':'<div class="callout">La recherche automatique nécessite la connexion à notre moteur LudoPilot. En attendant, tu peux déjà créer et enregistrer tes étapes manuellement.</div>'}</section>
      ${t?`<section class="card"><div class="eyebrow">Voyage sélectionné</div><h2>${esc(t.origin)} → ${esc(t.destination)}</h2><p class="subtitle">${t.segments.length} étape(s) préparée(s)${t.duration?" · "+esc(t.duration):""}${t.price?" · "+esc(t.price):""}</p><button class="btn wide" data-tab="etapes">Voir les étapes →</button></section>`:""}
      <div class="smallprint">⚠️ L'application n'invente ni prix, ni horaire, ni correspondance : vérifie toujours la disponibilité réelle d'un bateau ou d'un vol.</div>`;}
    function buildEtapes(){const t=active();if(!t)return `<h1>Mes étapes</h1><section class="card">Crée d'abord un voyage depuis l'onglet Voyage.</section>`;
      const segments=t.segments||[];const idx=Math.min(Math.max(0,t.currentIndex||0),Math.max(0,segments.length-1));return `<div class="eyebrow">Ton itinéraire</div><h1>Étape par étape</h1>${tripChooser()}
      <section class="card"><h2>${esc(t.origin)} → ${esc(t.destination)}</h2>${t.summary?`<p>${esc(t.summary)}</p>`:""}<p class="subtitle">${segments.length} segment(s)${t.duration?" · "+esc(t.duration):""}${t.price?" · "+esc(t.price):""}</p>
      ${Array.isArray(t.warnings)&&t.warnings.length?`<div class="callout warning">${t.warnings.map(x=>`⚠️ ${esc(x)}`).join("<div style='height:5px'></div>")}</div>`:""}
      ${segments.length?segments.map((s,i)=>{const warning=i>0&&segments[i-1].to.trim().toLowerCase()!==s.from.trim().toLowerCase();return `<div class="step ${idx===i?"active":""}"><div class="step-head"><span class="step-num">${i+1}</span><div style="flex:1"><div class="step-title">${esc(s.from)} → ${esc(s.to)}</div><div class="meta">${esc(MODES[s.mode]||s.modeLabel||"Transport")} ${s.service?" · "+esc(s.service):""}</div></div></div><div class="step-body">${warning?'<div class="callout warning">Correspondance non raccordée : vérifie les deux points.</div>':""}${s.notes?`<p class="meta">${esc(s.notes)}</p>`:""}${s.facts?.length?`<ul class="info-list">${s.facts.map(f=>`<li>${esc(f.text||"")}</li>`).join("")}</ul>`:""}<div class="actions" style="margin-top:12px"><button class="btn small ${idx===i?"teal":"secondary"}" data-choose="${i}">${idx===i?"✓ Étape active":"Activer cette étape"}</button><button class="btn small ghost" data-driver="${i}">🚕 Afficher au chauffeur</button></div></div></div>`;}).join(""):'<div class="callout">Aucune étape pour le moment. Ajoute chaque véhicule, ferry ou correspondance comme un segment distinct.</div>'}
      ${segments.length?`<div class="actions"><button class="btn ghost" id="prevSegment" ${idx===0?"disabled":""}>← Précédente</button><button class="btn teal" id="nextSegment">${idx>=segments.length-1?"✓ Terminer le voyage":"Étape suivante →"}</button></div>`:""}</section>
      <section class="card"><h2>➕ Ajouter une étape</h2><p class="subtitle">Un véhicule ou une traversée = un segment. N'oublie aucune correspondance.</p>${field("segFrom","Point de départ",segments.length?segments[segments.length-1].to:t.origin,'placeholder="Nom exact du lieu"')}${field("segTo","Point d’arrivée","",'placeholder="Terminal, port, hôtel…"')}<label for="segMode">Transport</label><select class="field" id="segMode">${modeOptions("taxi")}</select>${field("segService","Service / ligne (facultatif)","",'placeholder="Ex. Grab, ferry, numéro du vol"')}<label for="segNotes">Informations pratiques (facultatif)</label><textarea id="segNotes" class="field" placeholder="Durée, point de rendez-vous, prix vérifié…"></textarea><button class="btn teal wide" id="addSegment" style="margin-top:14px">Enregistrer cette étape</button></section>
      <div class="actions"><button class="btn ghost small" id="export">⬇️ Sauvegarder mes voyages</button><button class="btn danger small" id="deleteTrip">Supprimer ce voyage</button></div>`;}
    function driverDestination(s){return (s.toPlaceName&&s.toPlaceName.length>=4?s.toPlaceName:s.to)||s.to;}
    function driverAddress(s){return [s.toAddress,s.toCity,s.toCountry].filter(Boolean).join(", ");}
    function mapUrl(s){const geo=typeof s.toLatitude==="number"&&typeof s.toLongitude==="number"&&Math.abs(s.toLatitude)<=90&&Math.abs(s.toLongitude)<=180;const point=geo?`${s.toLatitude},${s.toLongitude}`:[s.to,driverAddress(s)].filter(Boolean).join(", ");const base=(s.mode==="plane"||s.mode==="ferry"||s.mode==="boat")?"https://www.google.com/maps/search/?api=1&query=":"https://www.google.com/maps/dir/?api=1&destination=";return base+encodeURIComponent(point);}
    const DRIVER_LANGS={auto:"Automatique",en:"English",th:"ไทย · Thaï",fil:"Filipino · Tagalog",id:"Bahasa Indonesia",es:"Español",fr:"Français"};
    const DRIVER_PHRASES={en:"Please take me to",th:"กรุณาพาไปที่",fil:"Pakihatid po ako sa",id:"Tolong antar saya ke",es:"Por favor, lléveme a",fr:"Veuillez me conduire à"};
    function resolvedDriverLang(t,s){
      if(state.driverLang!=="auto")return state.driverLang;
      const raw=[t?.destination,t?.origin,s?.toCountry,s?.to].join(" ").toLowerCase();
      if(/thailand|thailande|thaïlande|bangkok|chiang mai|phuket|krabi|pattaya/.test(raw))return "th";
      if(/philipp|manila|siquijor|cebu|dumaguete|taguig|makati|bohol|palawan/.test(raw))return "fil";
      if(/indones|indonés|jakarta|bali|bandung|surabaya|yogyakarta/.test(raw))return "id";
      if(/spain|espagne|denia|dénia|madrid|barcelon/.test(raw))return "es";
      if(/france|paris|lyon|marseille/.test(raw))return "fr";
      return "en";
    }
    function buildChauffeur(){const t=active();if(!t||!t.segments?.length)return `<div class="eyebrow">Navigation sur place</div><h1>🚕 Écran chauffeur</h1><section class="card"><p>Prépare ou sélectionne d'abord un segment dans l'onglet Étapes.</p><button class="btn wide" data-tab="etapes">Ouvrir mes étapes</button></section>`;
      const idx=Math.max(0,Math.min(t.currentIndex||0,t.segments.length-1)),s=t.segments[idx],dest=driverDestination(s),address=driverAddress(s);
      return `<div class="${state.big?"bigMode":""}"><div class="eyebrow">Étape ${idx+1} sur ${t.segments.length}</div><h1>Montre cet écran</h1><p class="subtitle">Uniquement l'arrivée du segment actif. Jamais la destination finale par erreur.</p><section class="card"><div class="driver-meta">${esc(MODES[s.mode]||s.modeLabel||"Transport")} · ${esc(s.from)} → ${esc(s.to)}</div><div class="driver-banner"><div class="driver-caption">Please take me to</div><div class="driver-place">${esc(dest)}</div>${resolvedDriverLang(t,s)!=="en"?`<div class="driver-caption" lang="${resolvedDriverLang(t,s)}">${esc(DRIVER_PHRASES[resolvedDriverLang(t,s)]||DRIVER_PHRASES.en)}</div><div class="driver-translation">${esc(dest)}</div>`:""}${address?`<div class="driver-address">📍 ${esc(address)}</div>`:""}</div><label for="driverLang">🌐 Langue du chauffeur</label><select class="field" id="driverLang">${Object.entries(DRIVER_LANGS).map(([k,v])=>`<option value="${k}" ${state.driverLang===k?"selected":""}>${esc(v)}</option>`).join("")}</select>
      <div class="actions hide-print" style="margin-top:18px"><button class="btn secondary" id="copyDriver">📋 Copier l'adresse</button><button class="btn teal" id="openMaps">🗺️ Google Maps</button></div><div class="actions hide-print" style="margin-top:9px"><button class="btn ghost" id="bigText">${state.big?"Réduire":"Agrandir"} le texte</button><button class="btn ghost" id="shareDriver">Partager</button></div></section>
      <div class="actions hide-print"><button class="btn ghost" id="prevSegment" ${idx===0?"disabled":""}>← Avant</button><button class="btn" id="nextSegment">${idx===t.segments.length-1?"✓ Terminé":"Étape suivante →"}</button></div><p class="smallprint" style="margin-top:12px">Pour un bateau ou un vol, Google Maps ouvrira la localisation de l'arrivée, et non un itinéraire routier fictif.</p></div>`;}
    function buildReglages(){return `<div class="eyebrow">Configuration</div><h1>Réglages</h1><section class="card"><h2>🧠 Connecter LudoPilot</h2><p class="subtitle">Saisis l'adresse publique de notre Cloudflare Worker pour rechercher automatiquement les itinéraires.</p>${field("worker","Adresse du moteur",state.worker,'type="url" inputmode="url" placeholder="https://nom-du-worker.exemple.workers.dev"')}<div class="callout warning">Ne renseigne jamais une clé OpenAI ou Google Maps ici. Les clés restent secrètes côté Cloudflare Worker.</div><button class="btn wide" id="saveWorker">Enregistrer le moteur</button></section>
      <section class="card"><h2>📦 Tes données</h2><p class="subtitle">Tes voyages sont conservés sur cet iPhone dans ce navigateur. Ils ne sont pas automatiquement synchronisés avec GitHub.</p><div class="actions"><button class="btn secondary" id="export">⬇️ Exporter JSON</button><button class="btn ghost" id="importButton">⬆️ Importer JSON</button></div><input style="display:none" type="file" id="importFile" accept=".json,application/json"></section>
      <section class="card"><h2>📴 Hors connexion</h2><p>Après une première ouverture en ligne et l'installation du service de cache, l'interface et les voyages enregistrés peuvent être consultés sans réseau.</p><p class="smallprint">Recherche, horaires actualisés et Google Maps en ligne requièrent une connexion. Ne considère pas les prix et horaires anciens comme confirmés.</p></section><p class="smallprint">LudoPilot Voyages V1 · Hébergement prévu : GitHub Pages · Moteur optionnel : Cloudflare Worker.</p>`;}
    function render(){byId("app").innerHTML=state.tab==="voyage"?buildVoyage():state.tab==="etapes"?buildEtapes():state.tab==="chauffeur"?buildChauffeur():buildReglages();document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===state.tab));byId("connection").textContent=navigator.onLine?"● En ligne":"○ Hors ligne";}
    function addSegment(){const t=active();if(!t)return;const from=byId("segFrom")?.value.trim(),to=byId("segTo")?.value.trim();if(!from||!to){toast("Indique le départ et l'arrivée de l'étape.");return;}if(from.toLowerCase()===to.toLowerCase()){toast("Départ et arrivée doivent être différents.");return;}if(t.segments.length>=16){toast("Maximum 16 segments par voyage.");return;}const prev=t.segments.at(-1);if(prev&&prev.to.trim().toLowerCase()!==from.toLowerCase()&&!confirm("Le départ de cette étape ne correspond pas à l'arrivée de la précédente. Continuer ?"))return;const s=normalizeSegment({from,to,mode:byId("segMode").value,service:byId("segService").value.trim(),notes:byId("segNotes").value.trim()},t.segments.length);t.segments.push(s);save();render();toast("Étape enregistrée sur cet iPhone.");}
    function advance(delta){const t=active();if(!t||!t.segments.length)return;const before=t.currentIndex||0;if(delta>0&&before>=t.segments.length-1){t.complete=true;save();toast("Dernière étape marquée terminée. Bon voyage !");return;}t.currentIndex=Math.max(0,Math.min(t.segments.length-1,before+delta));t.complete=false;save();render();}
    function clipboardText(s){const name=driverDestination(s),address=driverAddress(s),lng=resolvedDriverLang(active(),s),phrase=DRIVER_PHRASES[lng]||DRIVER_PHRASES.en;return `Please take me to: ${name}${address?"\n"+address:""}${lng!=="en"?"\n"+phrase+" "+name:""}`;}
    async function copyText(txt){try{await navigator.clipboard.writeText(txt);toast("Adresse copiée.");}catch(_){toast("Copie indisponible. Tu peux montrer cet écran.");}}
    function downloadJson(){const data=JSON.stringify({app:"LudoPilot Voyages",version:1,exported:new Date().toISOString(),trips:state.trips,activeId:state.activeId},null,2);const b=new Blob([data],{type:"application/json"}),url=URL.createObjectURL(b),a=document.createElement("a");a.href=url;a.download="ludopilot-voyages.json";a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);toast("Export prêt à enregistrer dans Fichiers.");}
    async function searchJourney(){const d=readJourney();if(!d.origin||!d.destination){toast("Renseigne le départ et la destination.");return;}if(!state.worker){toast("Configure d'abord l'adresse du moteur dans Réglages.");setTab("reglages");return;}if(state.busy)return;state.busy=true;render();try{const resp=await fetch(state.worker.replace(/\/+$/,"")+"/travel-info",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({origin:d.origin,destination:d.destination,via:d.via,localDateTime:d.dateTime||new Date().toISOString(),dateTime:d.dateTime||new Date().toISOString(),routePreference:d.preference,transportModes:{allowFerryBoat:true,allowBusShared:true,allowRail:true,allowTaxiGrab:true,allowLocalMotor:true},travelOptions:{}})});const json=await resp.json();if(!resp.ok||!json.ok||!json.info?.segments){throw Error(json.error||json.details||`Erreur HTTP ${resp.status}`);}const info=json.info;const t=newTrip({...d,summary:info.summary||"",price:info.ranking?.priceText||"",duration:info.ranking?.durationText||"",warnings:info.warnings||[],segments:info.segments.slice(0,16).map(normalizeSegment)});if(!t.segments.length)throw Error("Le moteur n'a fourni aucun segment.");state.trips.unshift(t);state.activeId=t.id;save();setTab("etapes");toast("Itinéraire reçu. Vérifie les horaires avant de partir.");}catch(e){toast("Recherche impossible : "+String(e.message||e).slice(0,120));}finally{state.busy=false;render();}}
    function saveWorker(){const raw=byId("worker")?.value.trim()||"";if(!raw){state.worker="";save();toast("Moteur déconnecté.");return;}try{const u=new URL(raw);if(u.protocol!=="https:")throw Error("HTTPS obligatoire");if(u.username||u.password||u.search||u.hash)throw Error("Adresse sans identifiant ni paramètre");state.worker=u.origin+u.pathname.replace(/\/+$/,"").replace(/\/travel-info$/,"");save();toast("Adresse du moteur enregistrée.");}catch(e){toast("URL invalide : "+e.message);}}
    async function importFile(file){if(!file)return;try{if(file.size>3_000_000)throw Error("Fichier trop volumineux");const o=JSON.parse(await file.text());if(!Array.isArray(o.trips))throw Error("Format non reconnu");const incoming=o.trips.filter(validateTrip).slice(0,60).map(t=>({...newTrip({origin:t.origin,destination:t.destination,via:String(t.via||""),dateTime:String(t.dateTime||""),preference:String(t.preference||"surface"),summary:String(t.summary||""),price:String(t.price||""),duration:String(t.duration||""),warnings:Array.isArray(t.warnings)?t.warnings.slice(0,10):[],segments:t.segments.slice(0,16).map(normalizeSegment)}),id:key(),currentIndex:Math.max(0,Math.min(Number(t.currentIndex)||0,t.segments.length-1))}));if(!incoming.length)throw Error("Aucun voyage valide");if(!confirm(`Importer ${incoming.length} voyage(s) en plus de tes voyages actuels ?`))return;state.trips=[...incoming,...state.trips].slice(0,60);state.activeId=incoming[0].id;save();setTab("etapes");toast(`${incoming.length} voyage(s) importé(s).`);}catch(e){toast("Import impossible : "+e.message);}}
    byId("tabs").addEventListener("click",e=>{const b=e.target.closest("[data-tab]");if(b)setTab(b.dataset.tab);});
    byId("app").addEventListener("change",e=>{if(e.target.id==="tripChooser"){state.activeId=e.target.value;save();render();}if(e.target.id==="importFile")importFile(e.target.files[0]);if(e.target.id==="driverLang"){state.driverLang=e.target.value;save();render();}});
    byId("app").addEventListener("click",async e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.tab){setTab(b.dataset.tab);return;}if(b.dataset.choose!=null){const t=active();t.currentIndex=Number(b.dataset.choose);t.complete=false;save();render();return;}if(b.dataset.driver!=null){const t=active();t.currentIndex=Number(b.dataset.driver);t.complete=false;save();setTab("chauffeur");return;}const t=active();switch(b.id){case"createJourney":createJourney();break;case"searchJourney":await searchJourney();break;case"addSegment":addSegment();break;case"prevSegment":advance(-1);break;case"nextSegment":advance(1);break;case"copyDriver":if(t)copyText(clipboardText(t.segments[t.currentIndex||0]));break;case"shareDriver":if(t){const txt=clipboardText(t.segments[t.currentIndex||0]);if(navigator.share)try{await navigator.share({text:txt});}catch(_){}else copyText(txt);}break;case"openMaps":if(t)window.open(mapUrl(t.segments[t.currentIndex||0]),"_blank","noopener,noreferrer");break;case"bigText":state.big=!state.big;render();break;case"saveWorker":saveWorker();break;case"export":downloadJson();break;case"importButton":byId("importFile")?.click();break;case"deleteTrip":if(t&&confirm(`Supprimer le voyage ${t.origin} → ${t.destination} de cet iPhone ?`)){state.trips=state.trips.filter(x=>x.id!==t.id);state.activeId=state.trips[0]?.id||null;save();setTab("voyage");}break;}});
    window.addEventListener("online",render);window.addEventListener("offline",render);
    if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));}
    render();
  })();
  </script>
